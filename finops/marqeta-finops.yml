specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Marqeta
providerId: marqeta
publisherName: Marqeta, Inc.
serviceCategory: Card Issuing & Processing
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Card Issuing
  - Payments
  - Fintech
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps shape for Marqeta: card-issuing platform billed as platform fee +
  per-active-card + per-transaction with interchange revenue share, all priced per program under MSA.'
notes: |
  Pricing is not publicly published; meter unit-prices remain unknown until quoted. Marqeta is a B2B
  platform - costs are typically allocated by program / BIN / card product within a finance org.
sources:
  - https://www.marqeta.com/platform
  - https://www.marqeta.com/about/investor-relations
principles:
  - name: Visibility
    description: Use the Marqeta Insights / DiVA reporting dashboard and the program's monthly invoice
      to observe platform fees, per-card counts, transaction volumes, and interchange share. Reconcile
      against your own authorization log via the Transactions endpoint of the Core API.
  - name: Allocation
    description: Allocate by program token and card product; tag transaction metadata (memo / user_token)
      with internal tenant or product IDs at issuance to enable downstream chargeback to the consuming
      business unit.
  - name: Optimization
    description: Sunset inactive cards (per-card fee dominates at low utilization), prefer virtual cards
      where physical issuance is unnecessary, batch state-changing API calls to reduce processing overhead,
      and renegotiate interchange share at volume thresholds.
  - name: Accountability
    description: Assign a program owner responsible for the monthly invoice, fraud loss, and chargeback
      ratios; review unit economics quarterly with the Marqeta account team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Rate Optimization
      - Workload Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - Invoicing and Chargeback
      - Onboarding Workloads
billingModel:
  pricingCategory: Subscription + Per-Transaction (Take Rate offset by Interchange Share)
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Adjustment
    - Credit
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Marqeta Card Issuing Platform
  ServiceCategory: Card Issuing & Processing
  ProviderName: Marqeta
  PublisherName: Marqeta, Inc.
  InvoiceIssuerName: Marqeta, Inc.
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: platform_fee
    description: Recurring platform fee per program / per BIN.
    unit: month
    aggregation: max
    dimensions:
      - program
      - bin
  - name: active_cards
    description: Count of active cards in the period.
    unit: card-month
    aggregation: avg
    dimensions:
      - program
      - card_product
      - state
  - name: card_transactions
    description: Authorized and/or settled transactions processed.
    unit: transaction
    aggregation: sum
    dimensions:
      - program
      - card_product
      - mcc
      - country
      - network
  - name: interchange_revenue_share
    description: Interchange revenue share returned to the program (a credit / negative cost).
    unit: USD
    aggregation: sum
    dimensions:
      - program
      - network
      - card_product
  - name: ancillary_services
    description: Optional services such as fraud management, dispute services, KYC, or accelerated wage.
    unit: varies
    aggregation: sum
    dimensions:
      - service
      - program
apis:
  - name: Marqeta Core API
    baseURL: https://sandbox-api.marqeta.com/v3
    tags:
      - Card Issuing
      - Fintech
      - Payment Processing
      - Payments
      - REST
    serviceName: Marqeta Core API
    serviceCategory: API
  - name: Marqeta DiVA API
    baseURL: https://diva-api.marqeta.com/data/v2
    tags:
      - Analytics
      - Data
      - Fintech
      - Reporting
      - REST
    serviceName: Marqeta DiVA API
    serviceCategory: API
  - name: Marqeta Webhooks
    baseURL: https://your-server.example.com/webhooks
    tags:
      - Events
      - Fintech
      - Notifications
      - Real-Time
      - Webhooks
    serviceName: Marqeta Webhooks
    serviceCategory: API
unitEconomics:
  - name: Cost per Active Card
    metric: billed_cost / active_cards
    target: TBD
  - name: Cost per Transaction
    metric: billed_cost / card_transactions
    target: TBD
maintainers:
