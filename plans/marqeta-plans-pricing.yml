description: Marqeta is sold under custom contracts. Pricing is bespoke per program
  covering interchange share, processing fees per transaction, card production, and
  platform minimums. There is no public self-serve pricing.
notes: Sandbox is free for evaluation. Production access requires a signed program
  agreement with Marqeta and a sponsor bank.
