specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Marqeta
providerId: marqeta
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Card Issuing
  - Fintech
  - Payments
  - Banking-as-a-Service
description: Marqeta operates a modern card-issuing platform (debit, credit, prepaid, virtual) with all
  pricing negotiated through direct sales engagement. Marqeta does not publish per-card, per-transaction,
  or per-program rates on its public site. Public 10-K filings show revenue is composed of platform fees
  plus interchange share net of partner costs, but unit pricing is not surfaced to API consumers.
notes: |
  No public pricing page exists. Marqeta's commercial terms (platform fee, per-card fee, per-transaction
  fee, interchange share) are quoted per program. Marked reconciled=false until quoted unit economics
  are obtained.
sources:
  - https://www.marqeta.com/
  - https://www.marqeta.com/platform
  - https://www.marqeta.com/about/investor-relations
plans:
  - id: marqeta-contact-sales
    name: Contact Sales
    type: enterprise
    description: All Marqeta programs (debit, credit, prepaid, expense, accelerated wage, etc.) are launched
      under a Master Services Agreement with negotiated unit economics. There is no self-serve tier; sandbox
      access is free to evaluate the API surface but production launch requires a signed program agreement.
    entries:
      - label: Platform Fee
        description: Recurring platform fee covering API access, processing, and program management; quoted
          per program.
        name: platform_fee
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: US
        domains:
          - https://sandbox-api.marqeta.com/v3
        unit: 1
        price: 'contact sales'
        userMultiplied: false
      - label: Per-Card Fee
        description: Per-active-card fee, billed monthly; rate varies by program type and volume.
        name: per_card_fee
        type: metered
        metric: card
        limit: -1
        timeFrame: month
        geo: US
        domains:
          - https://sandbox-api.marqeta.com/v3
        unit: 1
        price: 'contact sales'
        userMultiplied: false
      - label: Per-Transaction Fee
        description: Per-authorization or per-settled-transaction fee net of interchange share.
        name: per_transaction_fee
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: US
        domains:
          - https://sandbox-api.marqeta.com/v3
        unit: 1
        price: 'contact sales'
        userMultiplied: false
    elements:
      - name: Marqeta Core API (Issuing, Cardholders, Transactions)
      - name: Marqeta DiVA API (Reporting / Analytics)
      - name: Marqeta Webhooks (Real-Time Decisioning)
      - name: Just-in-Time (JIT) Funding
      - name: Tokenization (Apple Pay / Google Pay)
      - name: Sandbox Environment
      - name: Dedicated Implementation Team
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
