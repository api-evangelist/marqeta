specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Marqeta
providerId: marqeta
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- FinTech
- BaaS
- Card Issuing
- Payments
- Embedded Finance
- Rate Limiting
description: Marqeta enforces per-program rate limits on the Core API. Specific RPS
  is contracted per program.
notes: Real-time decisioning timeouts are typically <2 seconds.
sources:
- https://www.marqeta.com/docs/core-api
responseCodes:
  throttled: 429
limits:
- name: Core API
  scope: program
  metric: requests_per_second
  limit: 100
  notes: Default; programs can negotiate higher.
- name: RTD Timeout
  scope: program
  metric: milliseconds
  limit: 2000
  notes: Real-time decisioning hard timeout.
policies:
- name: Backoff Strategy
  description: Exponential backoff on 429.
- name: Idempotency
  description: Use idempotency-key headers on POST endpoints.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
