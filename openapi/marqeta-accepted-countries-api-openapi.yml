openapi: 3.0.3
info:
  contact:
    email: support@marqeta.com
    name: Marqeta
  description: Marqeta's Core API endpoints, conveniently annotated to enable code generation (including SDKs), test cases, and documentation. Currently in beta.
  termsOfService: https://www.marqeta.com/api-terms
  title: Core accepted countries API
  version: 3.0.39
servers:
- url: /v3
security:
- mqAppAndAccessToken: []
tags:
- name: accepted countries
paths:
  /acceptedcountries:
    get:
      operationId: getAcceptedcountries
      parameters:
      - description: Number of accepted countries to retrieve
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: 5
          format: int32
          type: integer
        style: form
      - description: Start index
        explode: true
        in: query
        name: start_index
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: Name
        explode: true
        in: query
        name: name
        required: false
        schema:
          type: string
        style: form
      - description: Whitelist
        explode: true
        in: query
        name: whitelist
        required: false
        schema:
          type: boolean
        style: form
      - description: Search type
        explode: true
        in: query
        name: search_type
        required: false
        schema:
          type: string
        style: form
      - description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      - description: Sort order
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: -lastModifiedTime
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedCountriesListResponse'
          description: Success
        '400':
          content: {}
          description: Bad request
        '500':
          content: {}
          description: Server failure
      summary: Lists all accepted countries
      tags:
      - accepted countries
  /acceptedcountries/{token}:
    get:
      operationId: getAcceptedcountriesToken
      parameters:
      - description: Accepted country token
        explode: false
        in: path
        name: token
        required: true
        schema:
          type: string
        style: simple
      - description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accepted_countries_model'
          description: Success
        '400':
          content: {}
          description: Bad request
        '404':
          content: {}
          description: Accepted country not found
        '500':
          content: {}
          description: Server failure
      summary: Returns a specific accepted country
      tags:
      - accepted countries
components:
  schemas:
    accepted_countries_model:
      properties:
        country_codes:
          items:
            type: string
          type: array
        created_time:
          format: date-time
          type: string
        is_whitelist:
          default: false
          type: boolean
        last_modified_time:
          format: date-time
          type: string
        name:
          type: string
        token:
          maxLength: 36
          minLength: 1
          type: string
      required:
      - country_codes
      - is_whitelist
      - name
      type: object
    AcceptedCountriesListResponse:
      properties:
        count:
          format: int32
          type: integer
        data:
          items:
            $ref: '#/components/schemas/accepted_countries_model'
          type: array
        end_index:
          format: int32
          type: integer
        is_more:
          default: false
          type: boolean
        start_index:
          format: int32
          type: integer
      type: object
  securitySchemes:
    mqAppAndAccessToken:
      scheme: basic
      type: http
