          type: boolean
        start_index:
          description: 'Sort order index of the first resource in the returned array.


            This field is returned if there are resources in your returned array.'
          format: int32
          type: integer
      type: object
    ads_payment_credentials_response:
      description: Response containing the details of a payment credential.
      properties:
        externalId:
          description: External ID of the Visa Alias.
          maxLength: 100
          minLength: 1
          type: string
        id:
          description: Unique identifier of the additional Visa Alias generated by the Alias Directory.
          maxLength: 36
          type: string
        type:
          description: The type of payment credential
          enum:
