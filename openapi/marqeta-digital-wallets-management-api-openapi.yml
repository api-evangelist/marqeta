        in: header
        name: req-sys-id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              aliases:
              - '123456'
              filters:
              - field: DIRECTORY_NAME
                value:
                - DIRECTORY_A
                - DIRECTORY_B
                - DIRECTORY_C
              transactionDetails:
                currencyCode: USD
              userDetails:
                userName: johndoe313
            schema:
              $ref: '#/components/schemas/ads_alias_inquiry_request'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
              - details:
                - aliasType: PHONE
                  aliasValue: '123456'
                  directories:
                  - directoryName: DIRECTORY_A
                    entities:
                    - id: '1101'
                    - id: '1102'
                      preferredFor:
                      - date: 1980-02-01
                        type: RECEIVE
                  - directoryName: DIRECTORY_B
                  directoriesName:
                  - DIRECTORY_A
                  - DIRECTORY_B
                summary:
                  aliasesFound: 1
                  aliasesNotFound: 0
                  aliasesRepeated: 0
                  aliasesTotal: 1
              schema:
                items:
                  $ref: '#/components/schemas/ads_alias_inquiry_response'
                type: array
          description: Success
        '400':
          description: User input error/Bad request
        '404':
          description: Not found
        '500':
          description: Internal server error
      summary: Check for Visa Alias
      tags:
      - Digital Wallets Management
