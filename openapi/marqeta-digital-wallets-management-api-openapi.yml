  /digitalwallettokens:
    get:
      description: Use this endpoint to retrieve a list of digital wallet tokens.
      operationId: getDigitalwallettokens
      parameters:
      - description: Number of digital wallet token resources to retrieve.
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: 10
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Sort order index of the first digital wallet token resource in the returned array.
        explode: true
        in: query
        name: start_index
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: 'Comma-delimited list of fields to return (`field_1,field_2`, and so on).

          Leave blank to return all fields.'
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      - description: 'Field on which to sort.

          Use any field in the resource model, or one of the system fields `lastModifiedTime` or `createdTime`.

          Prefix the field name with a hyphen (`-`) to sort in descending order.

          Omit the hyphen to sort in ascending order.'
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: -id
          type: string
        style: form
      - description: Date when the digital wallet token becomes active.
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          type: string
        style: form
      - description: Expiration date of the digital wallet token.
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          type: string
        style: form
      - description: 'Unique identifier of the digital wallet token primary account number (PAN) within the card network.

          This value may vary, depending on the digital wallet.

          For example, the `pan_reference_id` may be different in Apple Wallet and Google Wallet for the same digital wallet token.'
        explode: true
        in: query
        name: pan_reference_id
        required: false
        schema:
          type: string
        style: form
      - description: 'Unique identifier of the digital wallet token within the card network.

          The `token_reference_id` is unique at the card network level.'
        explode: true
        in: query
        name: token_reference_id
        required: false
        schema:
          type: string
        style: form
      - description: Unique value representing a tokenization request (Mastercard only).
        explode: true
        in: query
        name: correlation_id
        required: false
        schema:
          type: string
        style: form
      - description: Comma-delimited list of digital wallet token types to display.
        explode: true
        in: query
        name: token_type
        required: false
        schema:
          type: string
        style: form
      - description: 'Name of the token requestor within the card network.


          *NOTE:* The list of example values for this field is maintained by the card networks and is subject to change.'
        explode: true
        in: query
        name: token_requestor_name
        required: false
        schema:
          type: string
        style: form
      - description: Comma-delimited list of digital wallet token states to display.
        explode: true
        in: query
        name: state
        required: false
        schema:
          type: string
        style: form
      - description: An optional embedded user object.
        explode: true
        in: query
        name: embed
        required: false
        schema:
          enum:
          - user
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalWalletTokenListResponse'
          description: Success
        '400':
          content: {}
          description: User input error/Bad request
        '500':
          content: {}
          description: Server error
      summary: List digital wallet tokens
      tags:
      - Digital Wallets Management
