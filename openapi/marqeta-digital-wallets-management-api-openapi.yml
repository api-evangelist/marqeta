  /digitalwallets/postTokenizationAuthenticationDecision:
    post:
      description: 'Use this endpoint to submit a post-tokenization authentication decision from the customer to Marqeta in a secure card on file scenario.

        Marqeta validates the request, stores it, and forwards the authentication decision to Mastercard MDES in real time.

        Marqeta then returns the MDES response back to the customer synchronously.

        This enables issuers to notify Mastercard Digital Enablement Service (MDES) of the cardholder''s authentication outcome following tokenization, ensuring that the token requestor receives timely and accurate decisioning.'
      operationId: postTokenizationAuthenticationDecision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostTokenizationAuthenticationDecisionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostTokenizationAuthenticationDecisionResponse'
          description: Successful response
      summary: Submit a post-tokenization authentication decision
      tags:
      - Digital Wallets Management
