    PolicyProductPaymentConfiguration:
      description: Contains the configurations for billing cycle day, payment due day, and fees.
      properties:
        allocation_order:
          default:
          - INTEREST
          - FEES
          - PRINCIPAL
          description: Ordered list of balance types to which payments are allocated, from first to last.
          items:
            $ref: '#/components/schemas/PaymentAllocationOrderEnum'
          minItems: 1
          type: array
        billing_cycle_day:
          description: Day of the month when the billing cycle starts.
          maximum: 28
          minimum: 1
          type: integer
        billing_cycle_day_strategy:
          default: MANUAL
          description: Determines if the billing cycle day is manually set or determined dynamically during account creation based on cycling logic.
          enum:
          - MANUAL
          type: string
        billing_cycle_frequency:
          default: MONTHLY
          description: Frequency at which the account is billed.
          enum:
          - MONTHLY
          type: string
        due_day:
          deprecated: true
          description: 'Day of month the payment for the previous billing cycle is due.


            This field is being deprecated and replaced by `payment_due_interval` of a product policy.

            To retrieve `payment_due_interval`, see <</core-api/credit-policies#retrieveProductPolicy, Retrieve credit product policy, payments.payment_due_interval>>.'
          maximum: 31
          minimum: 31
          type: integer
        min_payment_calculation:
          $ref: '#/components/schemas/PolicyProductMinPaymentCalculation'
        payment_due_interval:
          default: -1
          description: 'Specifies the payment due interval that is used to determine the payment due date for a billing cycle.

            A value of -1 indicates one day prior to the next billing cycle date.


            For consumer programs, a minimum gap of 21 days is required between when a statement is delivered and the payment due date.'
          minimum: -1
          type: integer
