  /accounts/{account_token}/payments/{payment_token}:
    get:
      description: Retrieve a payment for a credit account.
      operationId: retrievePayment
      parameters:
      - description: 'Unique identifier of the credit account for which to retrieve a payment.


          Send a `GET` request to `/credit/accounts` to retrieve existing credit account tokens.'
        explode: false
        in: path
        name: account_token
        required: true
        schema:
          type: string
          x-allowableValues: Existing account token
        style: simple
      - description: 'Unique identifier of the payment to retrieve.


          Send a `GET` request to `/credit/accounts/{token}/payments` to retrieve existing payment tokens.'
        explode: false
        in: path
        name: payment_token
        required: true
        schema:
          type: string
          x-allowableValues: Existing payment token
        style: simple
      responses:
        '200':
          content:
            application/json:
              example:
                account_token: 7d68f45b-1232-4283-a0ea-6b0418d37692
                amount: 2500
                created_time: 2024-01-31 15:03:09.717000+00:00
                currency_code: USD
                description: Account statement payment
                hold_days: 1
                hold_end_time: 2024-02-03 11:32:24.727000+00:00
                is_manually_released: false
                metadata: \"bank_account_last_4_digits\":\"7234\\"bank_name\":\"Bank Finance Plus\"
                method: ACH
                on_hold: false
                payment_source_token: 4474c16b-7ba7-435b-8854-237d492e3f32
                returned_details: null
