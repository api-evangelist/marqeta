openapi: 3.0.3
info:
  contact:
    email: support@marqeta.com
    name: Marqeta
  description: Marqeta's Core API endpoints, conveniently annotated to enable code generation (including SDKs), test cases, and documentation. Currently in beta.
  termsOfService: https://www.marqeta.com/api-terms
  title: Core accepted countries Payments API
  version: 3.0.39
servers:
- url: /v3
security:
- mqAppAndAccessToken: []
tags:
- description: '// Conditional snippet for beta or internal content

    include::../../maturity-admonition-banner.adoc[]


    Use the payments endpoints to create and retrieve payments made on a <</core-api/credit-accounts, credit account>>, release payment holds, or transition payment statuses.


    A payment is an amount paid toward an account balance to reduce the total amount owed on the account.

    For more on payments, see <</developer-guides/about-credit-account-payments, About Credit Account Payments>>.


    To receive webhook notifications when ACH payment transition events occur, see <</core-api/event-types#_credit_account_payment_transition_events, Credit account payment transition events>> in Event Types.


    Creating a payment triggers the creation of a <</core-api/credit-account-journal-entries, journal entry>> belonging to the `PAYMENT` group.

    For more on payment journal entries, see <</developer-guides/about-credit-account-journal-entries#_payments, Payments>> in the About Credit Account Journal Entries guide.'
  name: Payments
paths:
  /accounts/{account_token}/payments:
    get:
      description: 'Retrieve an array of payments on a credit account.


        This endpoint supports <</core-api/sorting-and-pagination, sorting and pagination>>.'
      operationId: listPayments
      parameters:
      - description: 'Unique identifier of the credit account for which to retrieve payments.


          Send a `GET` request to `/credit/accounts` to retrieve existing credit account tokens.'
        explode: false
        in: path
        name: account_token
        required: true
        schema:
          type: string
          x-allowableValues: Existing account token
        style: simple
      - description: Beginning of the date range of the payments to return.
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          example: 2024-01-01
          format: date
          type: string
        style: form
      - description: End of the date range of the payments to return.
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          example: 2024-02-01
          format: date
          type: string
        style: form
      - description: Number of account payments resources to retrieve.
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: 5
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Sort order index of the first resource in the returned array.
        explode: true
        in: query
        name: start_index
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: 'Field on which to sort.

          Prefix the field name with a hyphen (`-`) to sort in descending order.

          Omit the hyphen to sort in ascending order.


          *NOTE:*

          You must sort using system field names such as `lastModifiedTime`, and not by the field names appearing in response bodies such as `last_modified_time`.'
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: -lastModifiedTime
          enum:
          - lastModifiedTime
          - -lastModifiedTime
          type: string
        style: form
      - description: Array of statuses by which to filter payments.
        explode: true
        in: query
        name: statuses
        required: false
        schema:
          items:
            $ref: '#/components/schemas/PaymentStatus'
          type: array
        style: form
      responses:
        '200':
          content:
            application/json:
              example:
                count: 2
                data:
                - account_token: 7d68f45b-1232-4283-a0ea-6b0418d37692
                  amount: 2500
                  created_time: 2024-01-31 15:03:09.717000+00:00
                  currency_code: USD
                  description: Account statement payment
                  hold_days: 1
                  hold_end_time: 2024-02-03 11:32:24.727000+00:00
                  is_manually_released: false
                  metadata: \"bank_account_last_4_digits\":\"7234\\"bank_name\":\"Bank Finance Plus\"
                  method: ACH
                  on_hold: false
                  payment_source_token: 4474c16b-7ba7-435b-8854-237d492e3f32
                  returned_details: null
                  status: COMPLETED
                  token: 4749ab00-fec1-471c-ac5b-b8d31d06d7e4
                  transitions:
                  - account_token: 7d68f45b-1232-4283-a0ea-6b0418d37692
                    created_time: 2024-02-01 02:04:11.645000+00:00
                    payment_token: 4749ab00-fec1-471c-ac5b-b8d31d06d7e4
                    status: PROCESSING
                    token: b62d45d5-4495-4490-a898-3781229b235d
                  - account_token: 7d68f45b-1232-4283-a0ea-6b0418d37692
                    created_time: 2024-02-01 03:39:22.505000+00:00
                    payment_token: 4749ab00-fec1-471c-ac5b-b8d31d06d7e4
                    status: SUBMITTED
                    token: 82d79178-5c97-41c2-80e5-bd99bb6bb61c
                  - account_token: 7d68f45b-1232-4283-a0ea-6b0418d37692
                    created_time: 2024-01-31 15:30:45.028000+00:00
                    payment_token: 4749ab00-fec1-471c-ac5b-b8d31d06d7e4
                    status: PENDING
                    token: c2a83d12-eeff-460a-b88a-bf7a2e40b251
                  - account_token: 7d68f45b-1232-4283-a0ea-6b0418d37692
                    created_time: 2024-02-02 11:32:24.727000+00:00
                    payment_token: 4749ab00-fec1-471c-ac5b-b8d31d06d7e4
                    status: COMPLETED
                    token: 156b5134-b37d-49cf-89d5-7123b321ba5c
                  - account_token: 7d68f45b-1232-4283-a0ea-6b0418d37692
                    created_time: 2024-01-31 15:03:09.723000+00:00
                    payment_token: 4749ab00-fec1-471c-ac5b-b8d31d06d7e4
                    status: INITIATED
                    token: 64ca6c83-937c-4d37-86ae-14766bf87540
                  updated_time: 2024-02-03 12:00:30.072000+00:00
                - account_token: my_account_token_12
                  allocations:
                  - amount: 25
                    bucket: PRINCIPAL
                  - amount: 15
                    bucket: INTEREST
                  - amount: 5
                    bucket: FEES
                  amount: 25
                  created_time: 2024-09-03 23:03:05.675000+00:00
                  currency_code: USD
                  description: minimum payment
                  hold_days: 0
                  is_manually_released: false
                  method: CHECK
                  on_hold: false
                  status: COMPLETED
                  token: my_payment_25
                  transitions:
                  - account_token: my_account_token_12
                    created_time: 2024-09-03 23:03:05.683000+00:00
                    payment_token: my_payment_25
                    status: COMPLETED
                    token: my_transition_token1234
                  updated_time: 2024-09-03 23:03:05.675000+00:00
                end_index: 2
                is_more: false
                start_index: 0
              schema:
                $ref: '#/components/schemas/PaymentsPage'
          description: Paginated list of payments for the given token.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
      - zionToken: []
      summary: List account payments
      tags:
      - Payments
    post:
      description: Create a new payment to apply toward a credit account's balance.
      operationId: createPayment
      parameters:
      - description: 'Unique identifier of the credit account for which to create a payment.


          Send a `GET` request to `/credit/accounts` to retrieve existing credit account tokens.'
        explode: false
        in: path
        name: account_token
        required: true
        schema:
          type: string
          x-allowableValues: Existing account token
        style: simple
      requestBody:
        content:
          application/json:
            example:
              amount: 2500
              currency_code: USD
              description: Account statement payment
              method: ACH
              payment_source_token: payment_source_token_1112
              token: payment_token_1239
            schema:
              $ref: '#/components/schemas/PaymentCreateReq'
        required: true
      responses:
        '201':
          content:
            application/json:
              example:
                account_token: 7d68f45b-1232-4283-a0ea-6b0418d37692
                amount: 2500
                created_time: 2024-01-31 15:03:09.717000+00:00
                currency_code: USD
                description: Account statement payment
                hold_days: 1
                hold_end_time: 2024-02-03 11:32:24.727000+00:00
                is_manually_released: false
