  /accounts/{account_token}/payments/{payment_token}/releasehold:
    post:
      description: Manually release a payment hold on a credit account.
      operationId: releasePaymentHold
      parameters:
      - description: 'Unique identifier of the credit account on which a payment hold is being released.


          Send a `GET` request to `/credit/accounts` to retrieve existing credit account tokens.'
        explode: false
        in: path
        name: account_token
        required: true
        schema:
          type: string
          x-allowableValues: Existing account token
        style: simple
      - description: 'Unique identifier of the payment currently on hold.


          Send a `GET` request to `/credit/accounts/{account_token}/payments` to retrieve existing payment tokens.'
        explode: false
        in: path
        name: payment_token
        required: true
        schema:
          type: string
          x-allowableValues: Existing payment token
        style: simple
      responses:
        '200':
          content:
            application/json:
              example:
                account_token: my_account_token_12
                amount: 25
                created_time: 2024-09-09 22:42:35.065000+00:00
                currency_code: USD
                description: minimum payment
                hold_days: 5
                hold_end_time: 2024-09-09 22:48:09.721000+00:00
                is_manually_released: true
                metadata: check_number123
                method: CHECK
                on_hold: false
                status: COMPLETED
                token: my_payment_25
                transitions:
                - account_token: account-12
                  created_time: 2024-09-09 22:42:35.068000+00:00
                  payment_token: my_payment_25
                  status: COMPLETED
                  token: my_transition_token1234
                updated_time: 2024-09-09 22:48:09.722000+00:00
              schema:
                $ref: '#/components/schemas/PaymentDetailResponse'
          description: Expected response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
      - zionToken: []
      summary: Release payment hold
      tags:
      - Payments
  /accounts/{account_token}/payments/{payment_token}/transitions:
    post:
      description: Transition a credit account payment's status to a new status.
      operationId: transitionPayment
      parameters:
      - description: 'Unique identifier of the credit account for which you want to transition a payment status.


          Send a `GET` request to `/credit/accounts` to retrieve existing credit account tokens.'
        explode: false
        in: path
        name: account_token
        required: true
        schema:
          type: string
          x-allowableValues: Existing account token
        style: simple
      - description: 'Unique identifier of the payment whose status you want to transition.


          Send a `GET` request to `/credit/accounts/{account_token}/payments` endpoint to retrieve existing payment tokens for a given account.'
        explode: false
        in: path
        name: payment_token
        required: true
        schema:
          type: string
          x-allowableValues: Existing payment token
        style: simple
      requestBody:
        content:
          application/json:
            example:
              status: RETURNED
            schema:
              $ref: '#/components/schemas/PaymentTransitionReq'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransitionResponse'
          description: Payment Transition Response object.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
      - zionToken: []
      summary: Transition account payment status
      tags:
      - Payments
  /webhooks/{event_type}/{resource_token}:
    post:
      description: 'Resends a credit event notification to your webhook endpoint.


        Although you send this request as a `POST`, all parameters are passed in the URL and the body is empty.

        The event notification is resent to your webhook endpoint and also returned in the response to this request.


        For details on how to configure your webhook endpoint, see the About Webhooks <</developer-guides/about-webhooks#_tutorial, tutorial>>.

        For the complete `/webhooks` endpoint reference, see <</core-api/webhooks, Webhooks>>.'
      operationId: resendWebhookEvent
      parameters:
      - description: Specifies the type of event you want to resend.
        explode: false
        in: path
        name: event_type
        required: true
        schema:
          enum:
          - ledgerentry
          - journalentry
          - accounttransition
          - accountstatement
          - paymenttransition
          - delinquencytransition
          - paymentreminders
          - substatus
          - accountsignupbonus
          type: string
        style: simple
      - description: 'Unique identifier of the resource for which you want to resend a notification.


          * Send a `GET` request to `/credit/accounts/{account_token}/journalentries` to retrieve existing journal entry tokens.

          * Send a `GET` request to `/credit/accounts/{account_token}/ledgerentries` to retrieve existing ledger entry tokens.

          * Send a `GET` request to `/accounts/{account_token}/accounttransitions` to retrieve existing account transition tokens.

          * Send a `GET` request to `/credit/accounts/{account_token}/payments/{payment_token}` to retrieve existing payment transition tokens.

          * Send a `GET` request to `/accounts/{account_token}/statements` to retrieve existing statement summary tokens.

          * Send a `GET` request to `/accounts/{account_token}/delinquencystate/transitions` to retrieve existing delinquency state transition tokens.

          * Send a `GET` request to `/accounts/{account_token}/statements/{statement_summary_token}/paymentreminders/{token}` to retrieve existing payment reminder tokens.

          * Send a `GET` request to `/credit/substatuses` to retrieve existing substatus tokens.

          * Send a `GET` request to `/credit/accounts` to retrieve existing credit account tokens and identify the specific account for the resend event.'
        explode: false
        in: path
        name: resource_token
        required: true
        schema:
          type: string
          x-allowableValues: Existing journal entry token, ledger entry token, account transition token, payment transition token, statement summary token, delinquency transition token, or substatus token
        style: simple
      responses:
        '200':
          content:
            application/json:
              examples:
                account_statement_sample:
                  summary: The following code block shows a sample of a resent `creditaccountstatements` event.
                  value:
                    account_token: my_credit_account_token
