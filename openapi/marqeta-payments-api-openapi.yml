                status: COMPLETED
                token: 4749ab00-fec1-471c-ac5b-b8d31d06d7e4
                transitions:
                - account_token: 7d68f45b-1232-4283-a0ea-6b0418d37692
                  created_time: 2024-02-01 02:04:11.645000+00:00
