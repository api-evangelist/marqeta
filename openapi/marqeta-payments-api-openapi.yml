components:
  schemas:
    PaymentsPage:
      description: Returns paginated payments
      properties:
        count:
          description: Number of resources returned.
          type: integer
        data:
          description: Contains one or more payments on a credit account.
          items:
            $ref: '#/components/schemas/PaymentDetailResponse'
          type: array
        end_index:
          description: Sort order index of the last resource in the returned array.
          type: integer
        is_more:
          description: A value of `true` indicates that more unreturned resources exist.
          type: boolean
        start_index:
          description: Sort order index of the first resource in the returned array.
          type: integer
      required:
      - count
      - data
      - end_index
      - is_more
      - start_index
      type: object
    RefundDetailsResponse:
      description: Contains details for a refund.
      nullable: true
      properties:
        description:
          description: Description of the refund.
          type: string
        method:
          $ref: '#/components/schemas/RefundMethod'
        status:
          $ref: '#/components/schemas/RefundStatus'
      required:
      - description
      - method
      - status
      type: object
    PaymentTransitionReq:
      description: Request used to transition the status of a payment.
      properties:
        refund_details:
          $ref: '#/components/schemas/RefundDetails'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        token:
          description: Unique identifier of the payment status transition.
          maxLength: 36
          type: string
        waive_returned_payment_fee:
          description: A value of `true` indicates that a returned payment fee should not be applied if one is applicable. This is false by default. This field is only considered during a transition to either `REFUNDED` or `RETURNED`
          type: boolean
      required:
      - status
      type: object
    CurrencyCode:
      default: USD
      description: Valid three-digit link:https://www.iso.org/iso-4217-currency-codes.html[ISO 4217 currency code, window="_blank"].
      enum:
      - USD
      type: string
    PaymentDetailResponse:
      description: Response containing payment details with transition history.
      properties:
        account_token:
          description: Unique identifier of the credit account on which the payment is made.
          maxLength: 36
          type: string
        allocations:
          description: List of objects that contain information about how a payment is allocated.
          items:
            $ref: '#/components/schemas/PaymentAllocationResponse'
          type: array
        amount:
          description: Total amount of the payment.
          minimum: 0
          type: number
        created_time:
          description: Date and time when the payment was created on Marqeta's credit platform, in UTC.
          format: date-time
          type: string
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        description:
          description: Description of the payment.
          type: string
        hold_days:
          default: 0
          description: After a payment completes, the number of days to hold the available credit on the account before increasing it.
          type: integer
        hold_end_time:
          description: Date and time when the available credit hold is released.
          format: date-time
          type: string
        is_manually_released:
          default: false
          description: Whether the available credit hold was manually released for this payment.
          type: boolean
        metadata:
          description: Customer-defined additional information about the payment (for example, a check number).
          type: string
        method:
          description: Method of payment.
          enum:
          - ACH
          - CHECK
          - DEBIT
          - CASH
          - SECURED_CARD
          type: string
        on_hold:
          default: false
          description: Whether the available credit is on hold for this payment.
          type: boolean
        payment_schedule_token:
          description: Unique identifier of the payment schedule.
          type: string
        payment_source_token:
          description: 'Unique identifier of the payment source.


            Required for ACH payments.'
          type: string
        program_migration_time:
          description: 'Date and time when the statement summary was migrated to Marqeta''s credit platform, in UTC.


            The value of this field is `null` if it has not been migrated.'
          format: date-time
          type: string
        refund_details:
          $ref: '#/components/schemas/RefundDetailsResponse'
        returned_details:
          $ref: '#/components/schemas/ReturnedDetails'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        token:
          description: 'Unique identifier of the payment.


            If in the `detail_object`, unique identifier of the detail object.'
          type: string
        transitions:
          description: Contains one or more `transitions` objects, which contain information about a payment status transition.
          items:
            $ref: '#/components/schemas/PaymentTransitionResponse'
          type: array
        updated_time:
          description: Date and time when the payment was last updated on Marqeta's credit platform, in UTC.
          format: date-time
          type: string
        waive_returned_payment_fee:
          description: 'A value of `true` indicates that a returned payment fee should not be applied.

            The default value of this field is `false`.


            This field is only considered when transitioning the status of the fee to `REFUNDED`.'
          type: boolean
      required:
      - account_token
      - amount
      - created_time
      - currency_code
      - description
      - hold_days
      - method
      - status
      - token
      - transitions
      - updated_time
      type: object
    PaymentStatus:
      description: Current status of the payment or refund.
      enum:
      - INITIATED
      - PENDING
      - PROCESSING
      - SUBMITTED
      - CANCELLED
      - COMPLETED
      - RETURNED
      - REFUNDED
      - SYS_ERROR
      - ACH_ERROR
      type: string
    ReturnedDetails:
      description: Contains information on a returned payment.
      nullable: true
      properties:
        return_code:
          description: 'Return code for the returned payment.

            For more, see <</developer-guides/ach-origination#_nacha_ach_return_codes, NACHA ACH return codes>>.'
          type: string
        return_reason:
          description: 'Reason the payment was returned.

            For more, see <</developer-guides/ach-origination#_nacha_ach_return_codes, NACHA ACH return codes>>.'
          type: string
      required:
      - return_code
      - return_reason
      type: object
    PaymentAllocationResponse:
      description: Object containing payment allocation information.
      properties:
        amount:
          description: Total amount of the payment allocation.
          minimum: 0
          type: number
        bucket:
          description: Category to which a portion of the payment is allocated.
          enum:
          - PRINCIPAL
          - INTEREST
          - FEES
          type: string
      required:
      - amount
      - bucket
      type: object
    WebhookEventResendContainerResponse:
      description: Contains information about a webhook event.
      properties:
        unused:
          description: Event notification that was resent to your webhook endpoint.
          type: string
      type: object
    RefundMethod:
      description: Payment instrument used to issue the refund.
      enum:
      - ACH
      - CHECK
      type: string
    RefundStatus:
      description: Current status of the refund.
      enum:
      - INITIATED
      - PENDING
      - PROCESSING
      - SUBMITTED
      - CANCELLED
      - COMPLETED
      - RETURNED
      type: string
    RefundDetails:
      description: Contains details for a refund.
      properties:
        description:
          description: Description of the refund.
          type: string
        method:
          $ref: '#/components/schemas/RefundMethod'
      required:
      - description
      - method
      type: object
    PaymentCreateReq:
      description: 'Object that is created when a user pays a portion or all of their statement balance.


        Applies to immediate payments only.

        Once the value is set to `ACTIVE`, it cannot be edited or deleted.'
      properties:
        amount:
          description: Amount of the payment.
          minimum: 0
          type: number
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        description:
          description: Description of the payment.
          maxLength: 255
          type: string
        hold_days:
          description: Overrides the configured default number of days for which to hold ACH and check payments.
          maximum: 30
          minimum: 0
          type: integer
        impact_time:
          description: Date and time when the payment impacts the account balance and fee calculations.
          format: date-time
          type: string
        metadata:
          description: Customer-defined additional information about the payment (for example, a check number).
          maxLength: 255
          type: string
        method:
          description: Method of payment.
          enum:
          - ACH
          - CHECK
          - DEBIT
          - CASH
          - SECURED_CARD
          type: string
        payment_source_token:
          description: Unique identifier of the payment source. Required for ACH payments.
          maxLength: 36
          type: string
        token:
          description: Unique identifier of the payment.
          maxLength: 36
          pattern: (?!^ +$)^.+$
          type: string
      required:
      - amount
      - currency_code
      - description
      - method
      type: object
    Error:
      properties:
        code:
          type: integer
        message:
          type: string
      type: object
    PaymentTransitionResponse:
      description: Response containing payment transition information.
      properties:
        account_token:
          description: Unique identifier of the credit account on which you want to transition a payment status.
          type: string
        created_time:
          description: Date and time when the payment transition was created on Marqeta's credit platform, in UTC.
          format: date-time
          type: string
        payment_token:
          description: Unique identifier of the payment whose status you want to transition.
          type: string
        status:
          $ref: '#/components/schemas/PaymentStatus'
        token:
          description: Unique identifier of the payment status transition.
          type: string
      required:
      - account_token
      - payment_token
      - status
      - token
      type: object
  securitySchemes:
    mqAppAndAccessToken:
      scheme: basic
      type: http
