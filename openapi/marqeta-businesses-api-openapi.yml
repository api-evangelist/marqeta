openapi: 3.0.3
info:
  contact:
    email: support@marqeta.com
    name: Marqeta
  description: Marqeta's Core API endpoints, conveniently annotated to enable code generation (including SDKs), test cases, and documentation. Currently in beta.
  termsOfService: https://www.marqeta.com/api-terms
  title: Core accepted countries businesses API
  version: 3.0.39
servers:
- url: /v3
security:
- mqAppAndAccessToken: []
tags:
- name: businesses
paths:
  /businesses:
    get:
      operationId: getBusinesses
      parameters:
      - description: Number of users to retrieve
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: 5
          format: int32
          type: integer
        style: form
      - description: Start index
        explode: true
        in: query
        name: start_index
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: Business name DBA
        explode: true
        in: query
        name: business_name_dba
        required: false
        schema:
          type: string
        style: form
      - description: Business name legal
        explode: true
        in: query
        name: business_name_legal
        required: false
        schema:
          type: string
        style: form
      - description: Search type
        explode: true
        in: query
        name: search_type
        required: false
        schema:
          type: string
        style: form
      - description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      - description: Sort order
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: -lastModifiedTime
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessCardHolderListResponse'
          description: Success
        '400':
          content: {}
          description: Bad request
        '500':
          content: {}
          description: Server error
      summary: Lists all businesses
      tags:
      - businesses
    post:
      operationId: postBusinesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/business_cardholder'
        required: false
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/business_card_holder_response'
          description: Success
        '400':
          content: {}
          description: User input error/Bad request
        '409':
          content: {}
          description: Request already processed with a different payload
        '500':
          content: {}
          description: Server error
      summary: Creates a business
      tags:
      - businesses
  /businesses/lookup:
    post:
      operationId: postBusinessesLookup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DDARequest'
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/business_cardholder'
          description: Success
        '404':
          content: {}
          description: Business not found
        '500':
          content: {}
          description: Server error
      summary: Returns a specific business
      tags:
      - businesses
  /businesses/{business_token}/directors:
    post:
      operationId: postBusinessesTokenDirectors
      parameters:
      - description: Business token
        explode: false
        in: path
        name: business_token
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/business_director_request_model'
        required: false
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cardholder_note_response_model'
          description: Success
        '400':
          content: {}
          description: Bad request
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '500':
          content: {}
          description: Server error
      summary: Creates a BusinessDirector for a business
      tags:
      - businesses
  /businesses/{business_token}/directors/{token}:
    get:
      operationId: getBusinessDirectorToken
      parameters:
      - description: Business token
        explode: false
        in: path
        name: business_token
        required: true
        schema:
          type: string
        style: simple
      - description: Business Director token
        explode: false
        in: path
        name: token
        required: true
        schema:
          type: string
        style: simple
      - description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/business_director_request_model'
          description: Success
        '400':
          content: {}
          description: Bad request
        '404':
          content: {}
          description: Business Director not found
        '500':
          content: {}
          description: Server error
      summary: Returns a specific business director
      tags:
      - businesses
    put:
      operationId: putBusinessesTokenBusinessDirectorToken
      parameters:
      - description: Business token
        explode: false
        in: path
        name: business_token
        required: true
        schema:
          type: string
        style: simple
      - description: Business Director token
        explode: false
        in: path
        name: token
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/business_director_request_model'
        required: false
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/business_director_response_model'
          description: Success
        '400':
          content: {}
          description: Bad request
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '500':
          content: {}
          description: Server error
      summary: Updates a specific business director for a business
      tags:
      - businesses
  /businesses/{business_token}/directors/{token}/identifications:
    get:
      operationId: getBusinessDirectorTokenSsn
      parameters:
      - description: Business token
        explode: false
        in: path
        name: business_token
        required: true
        schema:
          type: string
        style: simple
      - description: Business Director token
        explode: false
        in: path
        name: token
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: full_ssn
        required: false
        schema:
          type: boolean
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ssn_response_model'
          description: Success
        '400':
          content: {}
          description: Bad request
        '500':
          content: {}
          description: Server error
      summary: Returns a specific business director's SSN
      tags:
      - businesses
  /businesses/{parent_token}/children:
    get:
      operationId: getBusinessesParenttokenChildren
      parameters:
      - description: Number of users to retrieve
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: 5
          format: int32
          type: integer
        style: form
      - description: Start index
        explode: true
        in: query
        name: start_index
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: Token of parent business
        explode: false
        in: path
        name: parent_token
        required: true
        schema:
          type: string
        style: simple
      - description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      - description: Sort order
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: -lastModifiedTime
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessUserCardHolderListResponse'
          description: Success
        '400':
          content: {}
          description: User input error/Bad request
        '500':
          content: {}
          description: Server error
      summary: Lists all children of a parent business
      tags:
      - businesses
  /businesses/{token}:
    get:
      operationId: getBusinessesToken
      parameters:
      - description: Business token
        explode: false
        in: path
        name: token
        required: true
        schema:
          type: string
        style: simple
      - description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/business_card_holder_response'
          description: Success
        '400':
          content: {}
          description: Bad request
        '404':
          content: {}
          description: Business not found
        '500':
          content: {}
          description: Server error
      summary: Returns a specific business
      tags:
      - businesses
    put:
      operationId: putBusinessesToken
      parameters:
      - description: Business token
        explode: false
        in: path
        name: token
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/business_card_holder_update'
        description: Business object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/business_cardholder'
          description: Success
        '400':
          content: {}
          description: User input error/Bad request
        '500':
          content: {}
          description: Server error
      summary: Updates a specific business
      tags:
      - businesses
  /businesses/{token}/notes:
    get:
      operationId: getBusinessesTokenNotes
      parameters:
      - description: Business token
        explode: false
        in: path
        name: token
        required: true
        schema:
          type: string
        style: simple
      - description: Start index
        explode: true
        in: query
        name: start_index
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: Number of notes to retrieve
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: 5
          format: int32
          type: integer
        style: form
      - description: Created by
        explode: true
        in: query
        name: created_by
        required: false
        schema:
          type: string
        style: form
      - description: Comma-delimited list of created by user roles
        explode: true
        in: query
        name: created_by_user_role
        required: false
        schema:
          type: string
        style: form
      - description: Include private notes and private fields in note response
        explode: true
        in: query
        name: include_private
        required: false
        schema:
          type: boolean
        style: form
      - description: Search type
        explode: true
        in: query
        name: search_type
        required: false
        schema:
          type: string
        style: form
      - description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      - description: Sort order
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: -lastModifiedTime
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardHolderNoteListResponse'
          description: Success
        '400':
          content: {}
          description: Bad request
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '404':
          content: {}
          description: Business not found
        '500':
          content: {}
          description: Server error
      summary: Lists business notes
      tags:
      - businesses
    post:
      operationId: postBusinessesTokenNotes
      parameters:
      - description: Business token
        explode: false
        in: path
        name: token
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cardholder_note_request_model'
        required: false
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cardholder_note_response_model'
          description: Success
        '400':
          content: {}
          description: Bad request
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '500':
          content: {}
          description: Server error
      summary: Creates a note for a business
      tags:
      - businesses
  /businesses/{token}/notes/{notes_token}:
    put:
      operationId: putBusinessesTokenNotesNotestoken
      parameters:
      - description: Business token
        explode: false
        in: path
        name: token
        required: true
        schema:
          type: string
        style: simple
      - description: Notes token
        explode: false
        in: path
        name: notes_token
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/cardholder_note_update_request_model'
        required: false
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cardholder_note_response_model'
          description: Success
        '400':
          content: {}
          description: Bad request
        '401':
          content: {}
          description: Unauthorized
        '403':
          content: {}
          description: Forbidden
        '500':
          content: {}
          description: Server error
      summary: Updates a specific note for a business
      tags:
      - businesses
  /businesses/{token}/ssn:
    get:
      operationId: getBusinessesTokenSsn
      parameters:
      - description: Business token
        explode: false
        in: path
        name: token
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: full_ssn
        required: false
        schema:
          type: boolean
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ssn_response_model'
          description: Success
        '400':
          content: {}
          description: Bad request
        '500':
          content: {}
          description: Server error
      summary: Returns a specific business proprietor's SSN
      tags:
      - businesses
components:
  schemas:
    IdentificationResponseModel:
      description: Contains identifications associated with the cardholder.
      properties:
        expiration_date:
          description: Expiration date of the identification, if applicable.
          readOnly: true
          type: string
        issuing_country:
          readOnly: true
          type: string
        type:
          description: Type of identification.
          enum:
          - SSN
          - TIN
          - SIN
          - NIN
          - PASSPORT_NUMBER
          - DRIVERS_LICENSE
          - BUSINESS_NUMBER
          - BUSINESS_TAX_ID
          - TAXPAYER_REFERENCE
          readOnly: true
          type: string
        value:
          description: Number associated with the identification.
          readOnly: true
          type: string
      type: object
    CardHolderNoteListResponse:
      properties:
        count:
          format: int32
          type: integer
        data:
          items:
            $ref: '#/components/schemas/cardholder_note_response_model'
          type: array
        end_index:
          format: int32
          type: integer
        is_more:
          default: false
          type: boolean
        start_index:
          format: int32
          type: integer
      type: object
    business_card_holder_update:
      properties:
        account_holder_group_token:
          maxLength: 36
          minLength: 0
          type: string
        active:
          default: true
          type: boolean
        attestation_consent:
          default: false
          type: boolean
        attestation_date:
          format: date-time
          type: string
        attester_name:
          maxLength: 64
          minLength: 0
          type: string
        attester_title:
          maxLength: 64
          minLength: 0
          type: string
        beneficial_owner1:
          $ref: '#/components/schemas/beneficial_owner_request'
        beneficial_owner2:
          $ref: '#/components/schemas/beneficial_owner_request'
        beneficial_owner3:
          $ref: '#/components/schemas/beneficial_owner_request'
        beneficial_owner4:
          $ref: '#/components/schemas/beneficial_owner_request'
        business_name_dba:
          maxLength: 255
          minLength: 0
          type: string
        business_name_legal:
          maxLength: 255
          minLength: 0
          type: string
        business_type:
          maxLength: 255
          minLength: 0
          type: string
        date_established:
          format: date-time
          type: string
        duns_number:
          maxLength: 255
          minLength: 0
          type: string
        general_business_description:
          maxLength: 255
          minLength: 0
          type: string
        history:
          maxLength: 255
          minLength: 0
          type: string
        identifications:
          items:
            $ref: '#/components/schemas/IdentificationRequestModel'
          type: array
        in_current_location_since:
          format: date-time
          type: string
        incorporation:
          $ref: '#/components/schemas/business_incorporation'
        international_office_locations:
          maxLength: 255
          minLength: 0
          type: string
        ip_address:
          maxLength: 39
          minLength: 0
          type: string
        metadata:
          additionalProperties:
            type: string
          type: object
        notes:
          maxLength: 255
          minLength: 0
          type: string
        office_location:
          $ref: '#/components/schemas/AddressRequestModel'
        password:
          maxLength: 255
          minLength: 0
          type: string
        phone:
          maxLength: 16
          minLength: 0
          type: string
        primary_contact:
          $ref: '#/components/schemas/PrimaryContactInfoModel'
        proprietor_is_beneficial_owner:
          default: false
          type: boolean
        proprietor_or_officer:
          $ref: '#/components/schemas/business_proprietor'
        taxpayer_id:
          maxLength: 255
          minLength: 0
          type: string
        token:
          maxLength: 36
          minLength: 1
          type: string
        website:
          maxLength: 255
          minLength: 0
          type: string
      type: object
    beneficial_owner_request:
      properties:
        birth_place:
          maxLength: 255
          minLength: 0
          type: string
        dob:
          format: date-time
          type: string
        email:
          maxLength: 255
          minLength: 0
          type: string
        first_name:
          type: string
        home:
          $ref: '#/components/schemas/AddressRequestModel'
        identifications:
          items:
            $ref: '#/components/schemas/IdentificationRequestModel'
          type: array
        last_name:
          type: string
        middle_name:
          type: string
        nationality:
          maxLength: 255
          minLength: 0
          type: string
        ownership_percentage:
          maxLength: 40
          minLength: 0
          type: string
        phone:
          type: string
        ssn:
          type: string
        title:
          type: string
      type: object
    user_card_holder_response:
      description: Contains information about a cardholder.
      properties:
        account_holder_group_token:
          description: Associates the specified account holder group with the cardholder.
          maxLength: 36
          minLength: 0
          type: string
        active:
          default: false
          description: Specifies if the cardholder is in the `ACTIVE` state on the Marqeta platform.
          type: boolean
        address1:
          description: Cardholder's address.
          maxLength: 255
          minLength: 0
          type: string
        address2:
          description: Additional address information for the cardholder.
          maxLength: 255
          minLength: 0
          type: string
        authentication:
          $ref: '#/components/schemas/Authentication'
        birth_date:
          description: Cardholder's date of birth.
          type: string
        birth_place:
          description: Country where the cardholder was born.
          maxLength: 255
          minLength: 0
          type: string
        business_token:
          description: Unique identifier of the business resource.
          type: string
        city:
          description: City where the cardholder resides.
          maxLength: 40
          minLength: 0
          type: string
        company:
          description: Company name.
          maxLength: 255
          minLength: 0
          type: string
        corporate_card_holder:
          default: false
          description: Specifies if the cardholder holds a corporate card.
          type: boolean
        country:
          description: Country where the cardholder resides.
          maxLength: 40
          minLength: 0
          type: string
        created_time:
          description: Date and time when the resource was created, in UTC.
          format: date-time
          type: string
        email:
          description: Valid email address of the cardholder.
          maxLength: 255
          minLength: 1
          type: string
        first_name:
          description: Cardholder's first name.
          maxLength: 40
          minLength: 0
          type: string
        gender:
          description: Gender of the cardholder.
          enum:
          - F
          - M
          maxLength: 1
          minLength: 0
          type: string
        honorific:
          description: 'Cardholder''s title or prefix: Dr., Miss, Mr., Ms., and so on.'
          maxLength: 10
          minLength: 0
          type: string
        id_card_expiration_date:
          description: Expiration date of the cardholder's identification.
          readOnly: true
          type: string
        id_card_number:
          description: Cardholder's identification card number.
          maxLength: 255
          minLength: 0
          type: string
        identifications:
          description: One or more objects containing identifications associated with the cardholder.
          items:
            $ref: '#/components/schemas/IdentificationResponseModel'
          type: array
        ip_address:
          description: Cardholder's IP address.
          maxLength: 39
          minLength: 0
          type: string
        last_modified_time:
          description: Date and time when the resource was last updated, in UTC.
          format: date-time
          type: string
        last_name:
          description: Cardholder's last name.
          maxLength: 40
          minLength: 0
          type: string
        metadata:
          additionalProperties:
            type: string
          description: Associates any additional metadata you provide with the cardholder.
          type: object
        middle_name:
          description: Cardholder's middle name.
          maxLength: 40
          minLength: 0
          type: string
        nationality:
          description: Cardholder's nationality.
          maxLength: 255
          minLength: 0
          type: string
        notes:
          description: Any additional information pertaining to the cardholder.
          maxLength: 255
          minLength: 0
          type: string
        parent_token:
          description: Unique identifier of the parent user or business resource.
          maxLength: 36
          minLength: 1
          type: string
        passport_expiration_date:
          description: Expiration date of the cardholder's passport.
          readOnly: true
          type: string
        passport_number:
          description: Cardholder's passport number.
          maxLength: 40
          minLength: 0
          type: string
        password:
          description: Password to the cardholder's user account on the Marqeta platform.
          maxLength: 255
          minLength: 1
          type: string
        phone:
          description: Cardholder's telephone number.
          maxLength: 255
          minLength: 0
          type: string
        postal_code:
          description: Postal code of the cardholder's address.
          maxLength: 10
          minLength: 0
          type: string
        ssn:
          description: Cardholder's Social Security Number (SSN).
          type: string
        state:
          description: State or province where the cardholder resides.
          maxLength: 2
          minLength: 0
          type: string
        status:
          description: Specifies the status of the cardholder on the Marqeta platform.
          enum:
          - UNVERIFIED
          - LIMITED
          - ACTIVE
          - SUSPENDED
          - CLOSED
          - TERMINATED
          type: string
        title:
          description: Professional title of the cardholder, such as Chief Comptroller.
          maxLength: 255
          minLength: 0
          type: string
        token:
          description: Unique identifier of the cardholder.
          maxLength: 36
          minLength: 1
          type: string
        uses_parent_account:
          default: false
          description: Indicates whether the child shares balances with the parent (`true`), or the child's balances are independent of the parent (`false`).
          type: boolean
        zip:
          description: United States ZIP code of the cardholder's address.
          maxLength: 10
          minLength: 0
