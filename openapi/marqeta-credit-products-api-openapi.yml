openapi: 3.0.3
info:
  contact:
    email: support@marqeta.com
    name: Marqeta
  description: Marqeta's Core API endpoints, conveniently annotated to enable code generation (including SDKs), test cases, and documentation. Currently in beta.
  termsOfService: https://www.marqeta.com/api-terms
  title: Core accepted countries Credit Products API
  version: 3.0.39
servers:
- url: /v3
security:
- mqAppAndAccessToken: []
tags:
- description: '// Conditional snippet for beta or internal content

    include::../../maturity-admonition-banner.adoc[]


    [IMPORTANT]

    This feature is deprecated and replaced by credit product policies, which is part of the bundles feature.

    For more on policies and bundles in a credit program, see <</developer-guides/credit-programs-dashboard, Managing Credit Programs in the Marqeta Dashboard>>.


    The credit products feature on Marqeta''s credit platform enables you to create and manage a credit product and customize its characteristics, such as the credit line range and required fees or APRs.

    Credit product characteristics determine the behaviors and attributes of associated credit accounts.

    For more on credit products, see <</developer-guides/about-credit-products, About Credit Products>>.


    To receive webhook notifications when product transition events occur, see <</core-api/event-types#_credit_product_transition_events, Credit product transition events>> in Event Types.


    [IMPORTANT]

    ====

    To create and manage credit products, you must use the link:https://app.marqeta.com/[Marqeta Dashboard, window="_blank"].

    For more, see <</developer-guides/credit-products-dashboard, Managing Credit Products in the Marqeta Dashboard>>.


    &#160; +


    The following endpoints are displayed for reference purposes only.

    ===='
  name: Credit Products
paths:
  /products:
    get:
      description: 'Retrieve an array of credit products.


        This endpoint supports <</core-api/sorting-and-pagination, sorting and pagination>>.'
      operationId: listProducts
      parameters:
      - description: An array of statuses by which to filter credit products.
        explode: true
        in: query
        name: status
        required: false
        schema:
          items:
            $ref: '#/components/schemas/ResourceStatus'
          type: array
        style: form
      - description: Number of credit product resources to retrieve.
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: 5
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Sort order index of the first resource in the returned array.
        explode: true
        in: query
        name: start_index
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: 'Field on which to sort.

          Prefix the field name with a hyphen (`-`) to sort in descending order.

          Omit the hyphen to sort in ascending order.


          *NOTE:*

          You must sort using system field names such as `lastModifiedTime`, and not by the field names appearing in response bodies such as `last_modified_time`.'
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: -lastModifiedTime
          enum:
          - lastModifiedTime
          - -lastModifiedTime
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              example:
                count: 2
                data:
                - card_product_tokens:
                  - my_card_product1234
                  classification: CONSUMER
                  config:
                    billing_cycle_day: 1
                    fees:
                    - LATE_PAYMENT_FEE
                    fees_config: []
                    payment_due_day: 31
                    periodic_fees:
                    - frequency: ANNUAL
                      number_of_days_post_activation: 5
                    - frequency: MONTHLY
                      number_of_days_post_activation: 28
                    rewards_config: []
                  created_time: 2023-09-03 19:03:21.035000+00:00
                  credit_line:
                    max: 200000
                    min: 25
                  currency_code: USD
                  description: Description of credit product
                  interest_calculation:
                    day_count: ACTUAL
                    exclude_tran_types:
                    - ANNUAL_FEE
                    - LATE_PAYMENT_FEE
                    - CASH_BACK_STATEMENT_CREDIT
                    grace_days_application: NEXT_CYCLE_DATE
                    interest_application:
                    - PRINCIPAL
                    - FEES
                    interest_on_grace_reactivation: ACCRUE_FULL_CYCLE
                    method: AVG_DAILY_BALANCE_WITH_NEW_TRANSACTIONS
                    minimum_interest: 1
                  min_payment_calculation:
                    include_overlimit_amount: false
                    include_past_due_amount: false
                    min_payment_flat_amount: 25
                    min_payment_percentage:
                      include_fees_charged: []
                      include_interest_charged: false
                      percentage_of_balance: 1
                  min_payment_flat_amount: 25
                  min_payment_percentage: 1
                  name: Gold Card
                  payment_allocation_order:
                  - INTEREST
                  - FEES
                  - PRINCIPAL
                  product_sub_type: CREDIT_CARD
                  product_type: REVOLVING
