components:
  schemas:
    ResourceStatus:
      description: 'Status of the credit product.


        * `DRAFT` - The credit product is in the process of being created.

        * `PENDING_APPROVAL` - The credit product has been created and is awaiting approval.

        * `SENT_FOR_REVISION` - The credit product has been returned for revision.

        * `ACTIVE` - The credit product is active.

        * `REJECTED` - The credit product has been rejected; this status cannot be changed.

        * `ARCHIVED` - The previously active credit product has been archived.'
      enum:
      - DRAFT
      - PENDING_APPROVAL
      - SENT_FOR_REVISION
      - ACTIVE
      - REJECTED
      - ARCHIVED
      type: string
    ProductMinPaymentCalculation:
      description: Contains information used to calculate the minimum payment amount.
      properties:
        include_past_due_amount:
          description: Whether to include the past due amount when calculating the minimum payment.
          type: boolean
        min_payment_flat_amount:
          description: Minimum payment, expressed as a flat amount, due on the payment due day.
          minimum: 0.01
          type: number
        min_payment_percentage:
          $ref: '#/components/schemas/ProductMinPaymentPercentage'
      required:
      - include_overlimit_amount
      - include_past_due_amount
      - min_payment_flat_amount
      - min_payment_percentage
      type: object
    ProductConfig:
      description: Contains information on configurations for billing cycle day, payment due day, and fees.
      properties:
        billing_cycle_day:
          description: Day of the month when the billing cycle starts.
          maximum: 28
          minimum: 1
          type: integer
        billing_cycle_day_strategy:
          default: MANUAL
          description: Determines if the billing cycle day is manually set or determined dynamically during account creation based on cycling logic.
          enum:
          - MANUAL
          type: string
        billing_cycle_frequency:
          default: MONTHLY
          description: Frequency at which the account is billed.
          enum:
          - MONTHLY
          type: string
        fees:
          description: One or more fee types.
          items:
            $ref: '#/components/schemas/ProductFeeType'
          type: array
        payment_due_day:
          deprecated: true
          description: 'Day of month the payment for the previous billing cycle is due.


            This field is deprecated.

            Use the `product.payment_due_interval` field instead.

            To retrieve `payment_due_interval`, see <</core-api/credit-products#retrieveProduct, Retrieve credit product, config.payment_due_interval>>.'
          maximum: 31
          minimum: 31
          type: integer
        payment_due_interval:
          default: -1
          description: 'Specifies the payment due interval that is used to determine the payment due date for a billing cycle.

            A value of -1 indicates one day prior to the next billing cycle date.


            For consumer programs, a minimum gap of 21 days is required between when a statement is delivered and the payment due date.'
          minimum: -1
          type: integer
        periodic_fees:
          description: Contains one or more periodic fees.
          items:
            description: Contains information on a periodic fee.
            properties:
              frequency:
                description: How frequently the fee is charged.
                enum:
                - ANNUAL
                - MONTHLY
                type: string
              number_of_days_post_activation:
                description: 'Number of days after an account is activated that the initial fee is charged.

                  For example, if the value in this field is `30`, then the initial fee is charged 30 days after an account is activated.'
                maximum: 1000
                minimum: 1
                type: integer
            required:
            - frequency
            - number_of_days_post_activation
            title: ProductConfigPeriodicFees
            type: object
          type: array
      required:
      - billing_cycle_day
      type: object
    ProductClassification:
      default: CONSUMER
      description: 'Specifies for whom the credit product is intended.


        * `CONSUMER` - The credit product is intended for individual consumers.

        * `SMALL_AND_MEDIUM_BUSINESS` - The credit product is intended for small and medium business.'
      enum:
      - CONSUMER
      - SMALL_AND_MEDIUM_BUSINESS
      type: string
    InterestCalculation:
      description: Contains the configurations for interest calculation.
      properties:
        day_count:
          description: Day-count convention.
          enum:
          - ACTUAL
          type: string
        exclude_tran_types:
          default:
          - ANNUAL_FEE
          - MONTHLY_FEE
          - LATE_PAYMENT_FEE
          - CASH_BACK_STATEMENT_CREDIT
          - FOREIGN_TRANSACTION_FEE
          description: One or more transactions that are excluded from current billing period's interest charge, but included in next.
          items:
            enum:
            - LATE_PAYMENT_FEE
            - ANNUAL_FEE
            - MONTHLY_FEE
            - CASH_BACK_STATEMENT_CREDIT
            - RETURNED_PAYMENT_FEE
            - FOREIGN_TRANSACTION_FEE
            type: string
          type: array
        grace_days_application:
          description: Determines the last day of grace period based on which interest charges are calculated.
          enum:
          - NEXT_CYCLE_DATE
          type: string
        interest_application:
          default:
          - PRINCIPAL
          - FEES
          description: One or more balance types on which interest is applied.
          items:
            enum:
            - PRINCIPAL
            - FEES
            - INTEREST
            type: string
          minItems: 1
          type: array
        interest_on_grace_reactivation:
          $ref: '#/components/schemas/InterestOnGraceReactivationEnum'
        method:
          description: Method of interest calculation.
          enum:
