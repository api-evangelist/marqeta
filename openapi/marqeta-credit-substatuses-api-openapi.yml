openapi: 3.0.3
info:
  contact:
    email: support@marqeta.com
    name: Marqeta
  description: Marqeta's Core API endpoints, conveniently annotated to enable code generation (including SDKs), test cases, and documentation. Currently in beta.
  termsOfService: https://www.marqeta.com/api-terms
  title: Core accepted countries Credit Substatuses API
  version: 3.0.39
servers:
- url: /v3
security:
- mqAppAndAccessToken: []
tags:
- description: '// Conditional snippet for beta or internal content

    include::../../maturity-admonition-banner.adoc[]


    Credit substatuses can be applied to credit accounts or credit account holders.

    Substatuses should be applied only after verification with Customer Support and after the cardholder request for the substatus designation has been accepted.

    Substatuses define specific circumstances, such as bankruptcy, hardship or fraud.

    They also affect account behavior or activity, including interest accrual, authorization requests, and account termination.

    Substatus downstream account actions are not always reversible for the cardholder, which means that substatuses should be applied with caution.


    Use the substatus endpoints to apply or remove a substatus for a credit account or user.

    Applying a substatus causes immediate downstream changes to the account.

    For additional information about substatuses, see <</developer-guides/about-credit-accounts#_account-substatuses,Account substatuses>> or <</developer-guides/about-credit-accounts#_account-holder-substatuses,Account holder substatuses>> in the <</developer-guides/about-credit-accounts,About Credit Accounts>> guide.


    [NOTE]

    ====

    The substatus `SCRA` stands for "Servicemembers Civilian Relief Act."

    The substatus `MLA` stands for "Military Lending Act."

    ====


    For more information about receiving webhook notifications when account transition events occur, see <</core-api/event-types#_credit-substatus-events,Credit substatus events>> on the <</core-api/event-types,Event Types>> page.


    [IMPORTANT]

    ====

    If you are a Managed by Marqeta customer, a Marqeta customer service representative will apply the appropriate substatuses.

    ===='
  name: Credit Substatuses
paths:
  /substatuses:
    get:
      description: 'Retrieve an array of substatuses.

        This endpoint supports <</core-api/sorting-and-pagination,sorting and pagination>>.'
      operationId: listSubStatuses
      parameters:
      - description: 'Unique identifier of the account for which to retrieve substatuses.


          Send a `GET` request to `/credit/accounts` to retrieve existing account tokens.'
        explode: true
        in: query
        name: account_token
        required: false
        schema:
          type: string
          x-allowableValues: Existing account token
        style: form
      - description: 'Unique identifier of the user for which to retrieve substatuses.


          Send a `GET` request to `/users` to retrieve existing user tokens.'
        explode: true
        in: query
        name: user_token
        required: false
        schema:
          type: string
          x-allowableValues: Existing user token
        style: form
      - description: Denotes whether a substatus is active.
        explode: true
        in: query
        name: is_active
        required: false
        schema:
          type: boolean
          x-allowableValues: '`true`, `false`'
        style: form
      - description: 'Comma-delimited list of substatus types to include.

          Allowable values:

          `HARDSHIP`, `FRAUD`, `MLA`, `SCRA`, `DECEASED`, `BANKRUPTCY`, `POWER_OF_ATTORNEY`, `BLOCKED`, `CEASE_AND_DESIST`, `OPT_OUT`'
        explode: true
        in: query
        name: substatuses
        required: false
        schema:
          items:
            enum:
            - HARDSHIP
            - FRAUD
            - MLA
            - SCRA
            - DECEASED
            - BANKRUPTCY
            - POWER_OF_ATTORNEY
            - BLOCKED
            - CEASE_AND_DESIST
            - OPT_OUT
            type: string
          type: array
        style: form
      - description: The number of resources to retrieve.
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: 5
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Sort order index of the first resource in the returned array.
        explode: true
        in: query
        name: start_index
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: 'Field on which to sort.

          Prefix the field name with a hyphen (`-`) to sort in descending order.

          Omit the hyphen to sort in ascending order.'
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: -createdTime
          enum:
          - createdTime
          - -createdTime
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstatusPage'
          description: Expected response to a valid request.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
      - zionToken: []
      summary: List substatuses
      tags:
      - Credit Substatuses
    post:
      description: Create a new substatus for a credit account, user, or business.
      operationId: createSubStatus
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              attributes:
              - key: military_start_date
                value: 2024-04-02 11:23:23+00:00
              events:
              - channel: ADMIN
                reason: Documents submitted and verified
                state: ACTIVE
              resource_token: my_user_token
              resource_type: USER
              substatus: SCRA
            schema:
              $ref: '#/components/schemas/SubstatusCreateReq'
        required: true
      responses:
        '201':
          content:
            application/json:
              example:
                attributes:
                - key: military_start_date
                  value: 2024-04-02 11:23:23+00:00
                created_time: 2024-05-17 21:50:13.729000+00:00
                events:
                - channel: ADMIN
                  created_time: 2024-05-17 21:50:13.740000+00:00
                  effective_date: 2024-05-17 21:50:13.738000+00:00
                  reason: Documents submitted and verified
                  state: ACTIVE
                is_active: true
                resource_token: my_user_token
                resource_type: USER
                state: ACTIVE
                substatus: SCRA
                token: substatus_token
                updated_time: 2024-05-17 21:51:39.774000+00:00
              schema:
                $ref: '#/components/schemas/SubstatusResponse'
          description: Expected response to a valid request.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
      - zionToken: []
      summary: Create substatus
      tags:
      - Credit Substatuses
  /substatuses/{substatus_token}:
    get:
      description: Retrieve a user or account substatus.
      operationId: retrieveSubStatus
      parameters:
      - description: 'Unique identifier of the substatus to retrieve.


          Send a `GET` request to `/credit/substatuses` to retrieve existing substatus tokens.'
        explode: false
        in: path
        name: substatus_token
        required: true
        schema:
          type: string
          x-allowableValues: Existing substatus token
        style: simple
      responses:
        '200':
          content:
            application/json:
              example:
                attributes:
                - key: military_start_date
                  value: 2024-04-02 11:23:23+00:00
                created_time: 2024-04-02 11:23:23+00:00
                events:
                - channel: ADMIN
                  created_time: 2024-04-02 11:23:23+00:00
                  effective_date: 2024-04-02 11:23:23+00:00
                  reason: Documents submitted and verified
                  state: ACTIVE
                is_active: true
                resource_token: my_user_token
                resource_type: USER
                state: ACTIVE
                substatus: SCRA
                token: substatus_token
                updated_time: 2024-04-02 11:23:23+00:00
              schema:
                $ref: '#/components/schemas/SubstatusResponse'
          description: A JSON object containing substatus information
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
      - zionToken: []
      summary: Retrieve substatus
      tags:
      - Credit Substatuses
    put:
      description: Updating a substatus registers a new event that changes the substatus' state.
      operationId: updateSubStatus
      parameters:
      - description: 'Unique identifier of the account substatus resource to retrieve.


          Send a `GET` request to `/credit/substatuses` to retrieve existing substatus tokens.'
        explode: false
        in: path
        name: substatus_token
        required: true
        schema:
          type: string
          x-allowableValues: Existing substatus token
        style: simple
      requestBody:
        content:
          application/json:
            example:
              channel: ADMIN
              effective_date: 2024-04-09 11:23:23+00:00
              reason: Remove substatus from account
              state: INACTIVE
            schema:
              $ref: '#/components/schemas/SubstatusUpdateReq'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                attributes: []
                created_time: 2024-04-02 11:23:23+00:00
                events:
                - channel: SYSTEM
                  created_time: 2024-04-02 11:23:23+00:00
                  effective_date: 2024-04-02 11:23:23+00:00
                  reason: Fraud system detected suspicious activity
                  state: ACTIVE
                - channel: ADMIN
                  created_time: 2024-04-02 11:23:23+00:00
                  effective_date: 2024-04-02 11:23:23+00:00
                  reason: Verified non-fraud with cardholder
                  state: INACTIVE
                is_active: false
                resource_token: my_account_token
                resource_type: ACCOUNT
                state: INACTIVE
                substatus: FRAUD
                token: substatus_token
                updated_time: 2024-04-02 11:23:23+00:00
              schema:
                $ref: '#/components/schemas/SubstatusResponse'
          description: Updated substatus response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
      - zionToken: []
      summary: Update substatus
      tags:
      - Credit Substatuses
  /webhooks/{event_type}/{resource_token}:
    post:
      description: 'Resends a credit event notification to your webhook endpoint.


        Although you send this request as a `POST`, all parameters are passed in the URL and the body is empty.

        The event notification is resent to your webhook endpoint and also returned in the response to this request.


        For details on how to configure your webhook endpoint, see the About Webhooks <</developer-guides/about-webhooks#_tutorial, tutorial>>.

        For the complete `/webhooks` endpoint reference, see <</core-api/webhooks, Webhooks>>.'
      operationId: resendWebhookEvent
      parameters:
      - description: Specifies the type of event you want to resend.
        explode: false
        in: path
        name: event_type
        required: true
        schema:
          enum:
          - ledgerentry
          - journalentry
          - accounttransition
          - accountstatement
          - paymenttransition
          - delinquencytransition
          - paymentreminders
          - substatus
          - accountsignupbonus
          type: string
        style: simple
      - description: 'Unique identifier of the resource for which you want to resend a notification.


          * Send a `GET` request to `/credit/accounts/{account_token}/journalentries` to retrieve existing journal entry tokens.

          * Send a `GET` request to `/credit/accounts/{account_token}/ledgerentries` to retrieve existing ledger entry tokens.

          * Send a `GET` request to `/accounts/{account_token}/accounttransitions` to retrieve existing account transition tokens.

          * Send a `GET` request to `/credit/accounts/{account_token}/payments/{payment_token}` to retrieve existing payment transition tokens.

          * Send a `GET` request to `/accounts/{account_token}/statements` to retrieve existing statement summary tokens.

          * Send a `GET` request to `/accounts/{account_token}/delinquencystate/transitions` to retrieve existing delinquency state transition tokens.

          * Send a `GET` request to `/accounts/{account_token}/statements/{statement_summary_token}/paymentreminders/{token}` to retrieve existing payment reminder tokens.

          * Send a `GET` request to `/credit/substatuses` to retrieve existing substatus tokens.

          * Send a `GET` request to `/credit/accounts` to retrieve existing credit account tokens and identify the specific account for the resend event.'
        explode: false
        in: path
        name: resource_token
        required: true
        schema:
          type: string
          x-allowableValues: Existing journal entry token, ledger entry token, account transition token, payment transition token, statement summary token, delinquency transition token, or substatus token
        style: simple
      responses:
        '200':
          content:
            application/json:
              examples:
                account_statement_sample:
                  summary: The following code block shows a sample of a resent `creditaccountstatements` event.
