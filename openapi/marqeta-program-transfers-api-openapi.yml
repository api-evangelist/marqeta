          - CARDHOLDER_NOT_ACTIVE
          - BLOCKED_BY_ISSUER
          - BLOCKED_BY_CARDHOLDER
          - BLOCKED_MERCHANT_BY_CARDHOLDER
          - INVALID_DRIVER_NUMBER
          - INVALID_VEHICLE_NUMBER
          type: string
        incremental_authorization_jit_funding_tokens:
