components:
  schemas:
    PolicyDocumentTemplateURLs:
      description: Contains one or more URLs for a template.
      properties:
        html:
          description: URL to the HTML version of the document template.
          type: string
      required:
      - html
      type: object
    PolicyProductCreateReq:
      description: Request details for a credit product policy.
      properties:
        card_products:
          description: One or more card products associated with the credit product policy.
          items:
            $ref: '#/components/schemas/PolicyProductCardProductReq'
          minItems: 1
          type: array
        classification:
          $ref: '#/components/schemas/ProductClassification'
        credit_line:
          $ref: '#/components/schemas/ProductCreditLine'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        description:
          description: Description of the credit product policy.
          type: string
        interest_calculation:
          $ref: '#/components/schemas/InterestCalculation'
        name:
          description: Name of the credit product policy.
          minLength: 1
          type: string
        payments:
          $ref: '#/components/schemas/PolicyProductPaymentConfiguration'
        product_sub_type:
          $ref: '#/components/schemas/ProductSubType'
        product_type:
          $ref: '#/components/schemas/ProductType'
        token:
          description: Unique identifier of the credit product policy.
          pattern: (?!^ +$)^.+$
          type: string
        usage:
          description: One or more usage types for the credit product policy.
          items:
            $ref: '#/components/schemas/BalanceType'
          minItems: 1
          type: array
      required:
      - card_products
      - classification
      - credit_line
      - currency_code
      - interest_calculation
      - name
      - payments
      - product_sub_type
      - product_type
      - usage
      type: object
    PolicyRewardReq:
      description: Request details for a reward policy.
      properties:
        accrual_strategy:
          $ref: '#/components/schemas/PolicyRewardAccrualType'
        conversions:
          description: List of one or more reward conversions.
          items:
            $ref: '#/components/schemas/PolicyRewardConversion'
          minItems: 1
          type: array
        description:
          description: Description of the reward policy.
          type: string
        exclusions:
          $ref: '#/components/schemas/PolicyRewardExclusions'
        name:
          description: Name of the reward policy.
          pattern: (?!^ +$)^.+$
          type: string
        redemption_strategy:
          $ref: '#/components/schemas/PolicyRewardRedemptionStrategy'
        rounding_strategy:
          $ref: '#/components/schemas/PolicyRewardRoundingStrategy'
        rules:
          description: List of one or more reward rules.
          items:
            $ref: '#/components/schemas/PolicyRewardPlatformRule'
          minItems: 1
          type: array
        settlement_strategy:
          $ref: '#/components/schemas/PolicyRewardSettlementType'
        token:
          description: Unique identifier of the reward policy.
          pattern: (?!^ +$)^.+$
          type: string
      required:
      - conversions
      - exclusions
      - name
      - rules
      - settlement_strategy
      type: object
    PolicyFeeResponse:
      description: Contains information on a fee policy.
      properties:
        account:
          $ref: '#/components/schemas/PolicyFeeAccount'
        created_time:
          description: Date and time when the fee policy was created on Marqeta's credit platform, in UTC.
          format: date-time
          type: string
        description:
          description: Description of the fee policy.
          type: string
        name:
          description: Name of the fee policy.
          type: string
        token:
          description: Unique identifier of the fee policy.
          pattern: (?!^ +$)^.+$
          type: string
        updated_time:
          description: Date and time when the fee policy was last updated on Marqeta's credit platform, in UTC.
          format: date-time
          type: string
      type: object
    PolicyRewardSettlementType:
      description: Reward settlement strategy for a credit program.
      enum:
      - STATEMENT
      - LIVE
      type: string
    PolicyAprCreateReq:
      description: Request details for an APR policy.
      properties:
        description:
          description: Description of the APR policy.
          type: string
        name:
          description: Name of the APR policy.
          type: string
        purchases:
          $ref: '#/components/schemas/PolicyAprPurchaseReq'
        token:
          description: Unique identifier of the APR policy.
          pattern: (?!^ +$)^.+$
          type: string
      required:
      - name
      - purchases
      type: object
    PolicyDocumentAssetURLs:
      description: Contains one or more URLs for an asset.
      properties:
        html:
          description: URL to the HTML version of the asset.
          type: string
        pdf:
          description: URL to the PDF version of the asset.
          type: string
        png:
          description: URL to the PNG version of the asset.
          type: string
      required:
      - html
      - pdf
      - png
      type: object
    ProductSubType:
      default: CREDIT_CARD
      description: 'Subtype of the credit product type.


        * `CREDIT_CARD` - Card that enables the cardholder to make purchases on credit.

        * `SECURED_CARD` - Card backed by a user-funded deposit that enables the cardholder to make purchases on credit.'
      enum:
      - CREDIT_CARD
      - SECURED_CARD
      type: string
    PolicyProductUpdateReq:
      description: Request details to update a credit product policy.
      properties:
        card_products:
          description: One or more card products associated with the credit product policy.
          items:
            $ref: '#/components/schemas/PolicyProductCardProductReq'
          minItems: 1
          type: array
        classification:
          $ref: '#/components/schemas/ProductClassification'
        credit_line:
          $ref: '#/components/schemas/ProductCreditLine'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        description:
          description: Description of the credit product policy.
          type: string
        interest_calculation:
          $ref: '#/components/schemas/InterestCalculation'
        name:
          description: Name of the credit product policy.
          minLength: 1
          pattern: (?!^ +$)^.+$
          type: string
        payments:
          $ref: '#/components/schemas/PolicyProductPaymentConfiguration'
        product_sub_type:
          $ref: '#/components/schemas/ProductSubType'
        product_type:
          $ref: '#/components/schemas/ProductType'
        usage:
          description: One or more usage types for the credit product policy.
          items:
            $ref: '#/components/schemas/BalanceType'
          minItems: 1
          type: array
      required:
      - card_products
      - classification
      - credit_line
      - currency_code
      - interest_calculation
      - name
      - payments
      - product_sub_type
      - product_type
      - usage
      type: object
    PolicyDocumentTemplateResponse:
      description: Response details for a template.
      properties:
        template_created_time:
          description: Date and time when the template was created.
          format: date-time
          type: string
        template_token:
          description: Unique identifier of a template, which is a document that serves as an initial disclosure but does not contain finalized values.
          type: string
        template_urls:
          $ref: '#/components/schemas/PolicyDocumentTemplateURLs'
      type: object
    InterestOnGraceReactivationEnum:
      description: Determines whether to charge or waive interest for the billing period when the balance is paid off.
      enum:
      - ACCRUE_FULL_CYCLE
      - ACCRUE_PAYMENT_DATE
      - WAIVE
      type: string
    PoliciesDocumentPage:
      description: List response details for paginated document policies.
      properties:
        count:
          description: Number of resources returned.
          type: integer
        data:
          description: One or more document policies.
          items:
            $ref: '#/components/schemas/PolicyDocumentResponse'
          type: array
        end_index:
          description: Sort order index of the last resource in the returned array.
          type: integer
        is_more:
          description: A value of `true` indicates that more unreturned resources exist.
          type: boolean
        start_index:
          description: Sort order index of the first resource in the returned array.
          type: integer
      required:
      - count
      - data
      - end_index
      - is_more
      - start_index
      type: object
    Error:
      properties:
        code:
          type: integer
        message:
          type: string
      type: object
    ProductType:
      default: REVOLVING
      description: 'Type of credit product.


        `REVOLVING` - Allows users to continuously borrow and pay debts up to the credit limit.'
      enum:
      - REVOLVING
      type: string
    PolicyFeeCreateReq:
      description: Request details for a fee policy.
      properties:
        account:
          $ref: '#/components/schemas/PolicyFeeAccount'
        description:
          description: Description of the fee policy.
          type: string
        name:
          description: Name of the fee policy.
          type: string
        token:
          description: Unique identifier of the fee policy.
          pattern: (?!^ +$)^.+$
          type: string
      required:
      - account
      - name
      type: object
    PolicyFeeAccount:
      description: Contains information on the fees in an account's fee policy.
      properties:
        annual_fee:
          $ref: '#/components/schemas/PolicyFeePeriodic'
        foreign_transaction_fee:
          $ref: '#/components/schemas/PolicyFeeForeignTransaction'
        late_payment:
          $ref: '#/components/schemas/PolicyFeePayment'
        monthly_fee:
          $ref: '#/components/schemas/PolicyFeePeriodic'
        returned_payment:
          $ref: '#/components/schemas/PolicyFeePayment'
      type: object
    PolicyAprsPage:
      description: List response details for paginated APR policies.
      properties:
        count:
          description: Number of resources returned.
          type: integer
        data:
          description: One or more APR policies.
          items:
            $ref: '#/components/schemas/PolicyAprResponse'
          type: array
        end_index:
          description: Sort order index of the last resource in the returned array.
          type: integer
        is_more:
          description: A value of `true` indicates that more unreturned resources exist.
          type: boolean
        start_index:
          description: Sort order index of the first resource in the returned array.
          type: integer
      required:
      - count
      - data
      - end_index
      - is_more
      - start_index
      type: object
    PolicyDocumentAssetReq:
      description: Request details for a specific asset.
      properties:
        asset_token:
          description: 'Unique identifier of the asset, which is a type of document that contains finalized values.

            The values are finalized when the bundle containing the document is created.'
          pattern: (?!^ +$)^.+$
          type: string
      required:
      - asset_token
      type: object
    PolicyAprResponse:
      description: Contains information on an APR policy.
      properties:
        created_time:
          description: Date and time when the APR policy was created on Marqeta's credit platform, in UTC.
          format: date-time
          type: string
        description:
          description: Description of the APR policy.
          type: string
        effective_date:
          description: Date the APR goes into effect, in UTC.
          format: date
          type: string
        name:
          description: Name of the APR policy.
          type: string
        purchases:
          $ref: '#/components/schemas/PolicyAprPurchaseResponse'
        token:
          description: Unique identifier of the APR policy.
          pattern: (?!^ +$)^.+$
          type: string
        updated_time:
          description: Date and time when the APR policy was last updated on Marqeta's credit platform, in UTC.
          format: date-time
          type: string
      type: object
    PolicyFeePeriodic:
      description: Contains information on a specific periodic fee in a fee policy.
      properties:
        exclude_from_interest_calc:
          description: Whether the periodic fee is excluded from interest calculation.
          type: boolean
        fee_amount:
          description: Amount of the fee.
          maximum: 5000
          minimum: 1
          type: number
        number_of_days_post_activation:
          description: 'Number of days after an account is activated that the initial fee is charged.

            For example, if the value in this field is `30`, then the initial fee is charged 30 days after an account is activated.'
          maximum: 1000
          minimum: 1
          type: number
      type: object
    PolicyAprTierReq:
      description: Request details for the APR for a risk tier.
      properties:
