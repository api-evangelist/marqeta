        min_payment_percentage:
          $ref: '#/components/schemas/PolicyProductMinPaymentPercentage'
      required:
      - include_overlimit_amount
      - include_past_due_amount
      type: object
    PolicyRewardConversionType:
      description: Type of conversion.
      enum:
      - STATEMENT_CREDIT
      type: string
    PolicyFeePayment:
      description: Contains information on a specific fee in a fee policy.
      properties:
        default_method:
          description: Method used to calculate the fee value.
          enum:
          - FLAT
          type: string
        default_value:
          description: Amount of the fee.
          type: number
      type: object
    PolicyRewardRedemptionStrategy:
      default: MANUAL
      description: 'Redemption strategy for reward redemption behavior.

        If no value for `redemption_strategy` is set, then the default value of this field is `MANUAL`.


        Available options:


        * `AUTO`: Automatically redeem rewards when conditions are met.

        * `MANUAL`: Require manual intervention for reward redemption (default).'
      enum:
      - AUTO
      - MANUAL
      type: string
    PolicyRewardConversion:
      description: Defines the conversion properties intended for a reward policy.
      properties:
        conversion_increment:
          description: The static amount to reward if the rule conditions are met.
          type: integer
        conversion_rate:
          description: The rate that points are worth with converting the REDEMPTION_TYPE indicated.
          format: decimal
          minimum: 0.001
          type: number
        currency:
          description: Type of currency used with the conversion rate.
          type: string
        type:
          $ref: '#/components/schemas/PolicyRewardConversionType'
      required:
      - conversion_increment
      - conversion_rate
      - type
      type: object
    PolicyRewardExclusions:
      description: 'Defines what merchant category codes (MCCs) are excluded from earning rewards.

        MCCs must be a four-digit number, or a range of two four-digit numbers separated by a hyphen.'
      properties:
        custom_exclusions:
          description: 'List of merchant category codes (MCCs).

            MCCs must be a four-digit number, or a range of two four-digit numbers separated by a hyphen.'
          items:
            type: string
          type: array
        use_default_exclusions:
          description: 'Indicates whether to use the default exclusion list.


            * If `true`, the default exclusion list is used.

            * If `false`, the custom exclusion list is used, if custom exclusions are included.'
          type: boolean
      type: object
  securitySchemes:
    mqAppAndAccessToken:
      scheme: basic
      type: http
