openapi: 3.0.3
info:
  contact:
    email: support@marqeta.com
    name: Marqeta
  description: Marqeta's Core API endpoints, conveniently annotated to enable code generation (including SDKs), test cases, and documentation. Currently in beta.
  termsOfService: https://www.marqeta.com/api-terms
  title: Core accepted countries Policies API
  version: 3.0.39
servers:
- url: /v3
security:
- mqAppAndAccessToken: []
tags:
- description: '// Conditional snippet for beta or internal content

    include::../../maturity-admonition-banner.adoc[]


    The Marqeta credit platform''s policies feature enables you to customize the configurations of policies for documents (such as disclosures), credit products, fees, APRs, and rewards.

    You can choose the specific policies to add to a bundle that contain the exact configurations needed to launch a new credit program or help manage an existing one.

    The configurations of each policy in a bundle determine the characteristics and attributes of the bundle''s associated credit accounts, reward programs, disclosures, and more.

    For more on how to create a bundle, see <</core-api/credit-bundles, Bundles>>.


    [IMPORTANT]

    ====

    To create and manage policies, you must use the link:https://app.marqeta.com/[Marqeta Dashboard, window="_blank"].

    For more on policies in the dashboard, see <</developer-guides/credit-programs-dashboard, Managing Credit Programs in the Marqeta Dashboard>>.


    &#160; +


    The following endpoints are displayed for reference purposes only.

    ===='
  name: Policies
paths:
  /policies/aprs:
    get:
      description: 'Retrieve an array of existing APR policies.


        This endpoint supports <</core-api/sorting-and-pagination, sorting and pagination>>.'
      operationId: getAprPolicies
      parameters:
      - description: Number of APR policy resources to retrieve.
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: 5
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Sort order index of the first resource in the returned array.
        explode: true
        in: query
        name: start_index
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: 'Field on which to sort.

          Prefix the field name with a hyphen (`-`) to sort in descending order.

          Omit the hyphen to sort in ascending order.


          *NOTE:*

          You must sort using system field names such as `effectiveDate`, and not by the field names appearing in response bodies such as `effective_date`.'
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: -effectiveDate
          enum:
          - effectiveDate
          - -effectiveDate
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              example:
                count: 2
                data:
                - created_time: 2025-04-01 23:41:58.802000+00:00
                  description: A gold APR policy
                  effective_date: 2025-05-01
                  name: Gold APR Policy
                  purchases:
                    external_token: my_external_purchase_token1234
                    name: A purchase at a merchant
                    tiers:
                    - apr: 0
                      margin_rate: 1
                    - apr: 0
                      margin_rate: 5
                  token: my_apr_policy_token_1234
                  updated_time: 2025-04-05 16:04:48.643000+00:00
                - created_time: 2025-04-01 23:41:58.802000+00:00
                  description: A silver APR policy
                  effective_date: 2025-06-01
                  name: Silver APR Policy
                  purchases:
                    external_token: my_external_purchase_token4321
                    name: A purchase at a merchant
                    tiers:
                    - apr: 0
                      margin_rate: 3
                    - apr: 0
                      margin_rate: 6
                  token: my_apr_policy_token_4321
                  updated_time: 2025-04-05 16:04:48.643000+00:00
                end_index: 2
                is_more: true
                start_index: 0
              schema:
                $ref: '#/components/schemas/PolicyAprsPage'
          description: Expected response to a valid request.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
      - zionToken: []
      summary: List APR policies
      tags:
      - Policies
    post:
      description: Create a new annual percentage rate (APR) policy.
      operationId: createAprPolicy
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              description: A gold APR policy
              name: Gold APR Policy
              purchases:
                external_token: my_external_purchase_token1234
                name: A purchase at a merchant
                tiers:
                - apr: 0
                  margin_rate: 1
                - apr: 0
                  margin_rate: 5
              token: my_apr_policy_token_1234
            schema:
              $ref: '#/components/schemas/PolicyAprCreateReq'
        required: true
      responses:
        '201':
          content:
            application/json:
              example:
                created_time: 2025-04-01 23:41:58.802000+00:00
                description: A gold APR policy
                effective_date: 2025-05-01
                name: Gold APR Policy
                purchases:
                  external_token: my_external_purchase_token1234
                  name: A purchase at a merchant
                  tiers:
                  - apr: 0
                    margin_rate: 1
                  - apr: 0
                    margin_rate: 5
                token: my_apr_policy_token_1234
                updated_time: 2025-04-05 16:04:48.643000+00:00
              schema:
                $ref: '#/components/schemas/PolicyAprResponse'
          description: Expected response
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
      - zionToken: []
      summary: Create APR policy
      tags:
      - Policies
