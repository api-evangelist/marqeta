  /fundingsources/program/ach:
    get:
      operationId: getAllACHFundingSources
      parameters:
      - description: Number of items to retrieve. Count can be between 1 - 10 items.
        explode: true
        in: query
        name: count
        required: false
        schema:
          default: 5
          format: int32
