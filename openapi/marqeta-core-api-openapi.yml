        token:
          type: string
          description: Unique identifier of the KYC record.
        user_token:
          type: string
          description: Token of the user that was verified.
        result:
          type: object
          description: KYC verification result.
          properties:
            status:
              type: string
              description: Overall KYC verification status.
              enum: [PASSED, FAILED, PENDING]
            codes:
              type: array
              description: List of result codes from identity checks.
              items:
                type: object
                properties:
                  code:
                    type: string
                    description: Result code identifier.
                  description:
                    type: string
                    description: Human-readable description of the result.
        created_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the KYC verification was submitted.
    KycListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              description: Array of KYC verification records.
              items:
                $ref: '#/components/schemas/KycResponse'
