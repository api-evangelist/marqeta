              items:
                $ref: '#/components/schemas/UserTransitionResponse'
    CardRequest:
      type: object
      description: Request body for issuing a new payment card.
      required:
        - card_product_token
        - user_token
      properties:
        token:
          type: string
          description: Optional unique identifier for the card.
          maxLength: 36
        card_product_token:
          type: string
          description: Token of the card product to derive the card from.
        user_token:
          type: string
          description: Token of the user to issue the card to.
        fulfillment:
          type: object
          description: Fulfillment address for physical card delivery.
          properties:
            shipping:
              type: object
              description: Shipping address and method for physical card delivery.
              properties:
                method:
                  type: string
                  description: Shipping method for the card.
                  enum: [LOCAL_MAIL, GROUND, TWO_DAY, OVERNIGHT]
                recipient_address:
                  $ref: '#/components/schemas/Address'
        metadata:
          type: object
          description: Custom metadata to associate with the card.
          additionalProperties:
            type: string
    CardUpdateRequest:
      type: object
      description: Request body for updating a card's metadata or configuration.
      properties:
        metadata:
          type: object
          description: Updated custom metadata to associate with the card.
          additionalProperties:
            type: string
    CardResponse:
      type: object
      description: Payment card resource returned by the Marqeta Core API.
      properties:
        token:
          type: string
          description: Unique identifier of the card.
        card_product_token:
          type: string
          description: Token of the card product this card is derived from.
        user_token:
          type: string
          description: Token of the user this card belongs to.
        last_four:
          type: string
          description: Last four digits of the card PAN.
          pattern: '^\d{4}$'
        pan:
          type: string
          description: Full 16-digit PAN (only returned at card creation if show_pan=true).
        cvv_number:
          type: string
          description: Card CVV2 value (only returned at card creation if show_cvv_number=true).
        expiration:
          type: string
          description: Card expiration date in MMYY format.
          pattern: '^\d{4}$'
        expiration_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp of card expiration.
        state:
          type: string
          description: Current state of the card.
          enum: [ACTIVE, SUSPENDED, TERMINATED, UNACTIVATED, LIMITED, UNSUPPORTED]
        state_reason:
          type: string
          description: Reason for the current state.
        fulfillment_status:
          type: string
          description: Physical card fulfillment status.
          enum: [ISSUED, ORDERED, REORDERED, REJECTED, SHIPPED, DELIVERED, DIGITALLY_PRESENTED]
        created_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the card was created.
        last_modified_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the card was last modified.
        metadata:
          type: object
          description: Custom metadata associated with the card.
          additionalProperties:
            type: string
    CardListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              description: Array of card records.
              items:
                $ref: '#/components/schemas/CardResponse'
    CardTransitionRequest:
      type: object
      description: Request body for transitioning a card to a new state.
      required:
        - card_token
        - state
        - reason_code
        - channel
      properties:
        token:
          type: string
          description: Optional unique identifier for the transition record.
        card_token:
          type: string
          description: Token of the card to transition.
        state:
          type: string
          description: Target state for the card.
          enum: [ACTIVE, SUSPENDED, TERMINATED, UNSUPPORTED]
        reason_code:
          type: string
          description: Code indicating the reason for the transition.
        reason:
          type: string
          description: Human-readable description of the reason.
          maxLength: 255
        channel:
          type: string
          description: Channel through which the transition was initiated.
          enum: [API, IVR, FRAUD, ADMIN, SYSTEM, AUTOMATED, CARDHOLDER]
    CardTransitionResponse:
      type: object
      description: Card transition record returned by the Marqeta Core API.
      properties:
        token:
          type: string
          description: Unique identifier of the transition record.
        card_token:
          type: string
          description: Token of the card that was transitioned.
        state:
          type: string
          description: New state applied to the card.
        reason_code:
          type: string
          description: Reason code for the transition.
        reason:
          type: string
          description: Human-readable reason for the transition.
        channel:
          type: string
          description: Channel through which the transition occurred.
        created_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the transition was created.
    CardTransitionListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              description: Array of card transition records.
              items:
                $ref: '#/components/schemas/CardTransitionResponse'
    CardProductRequest:
      type: object
      description: Request body for creating or updating a card product.
      required:
        - name
        - start_date
        - config
      properties:
        token:
          type: string
          description: Optional unique identifier for the card product.
          maxLength: 36
        name:
          type: string
          description: Name of the card product.
          maxLength: 40
        start_date:
          type: string
          format: date
          description: Date on which the card product becomes active (YYYY-MM-DD).
        end_date:
          type: string
          format: date
          description: Optional date on which the card product expires (YYYY-MM-DD).
        config:
          type: object
          description: Configuration object defining card behavior and controls.
          properties:
            fulfillment:
              type: object
              description: Physical card fulfillment settings.
              properties:
                payment_instrument:
                  type: string
                  description: Card form factor.
                  enum: [PHYSICAL_MSR, PHYSICAL_ICC, PHYSICAL_CONTACTLESS, PHYSICAL_COMBO, VIRTUAL_PAN]
            poi:
              type: object
              description: Point of interaction settings for online and POS usage.
            jit_funding:
              type: object
              description: Just-in-time funding configuration.
    CardProductResponse:
      type: object
      description: Card product resource returned by the Marqeta Core API.
      properties:
        token:
          type: string
          description: Unique identifier of the card product.
        name:
          type: string
          description: Name of the card product.
        active:
          type: boolean
          description: Whether the card product is currently active.
        start_date:
          type: string
          format: date
          description: Date on which the card product became active.
        end_date:
          type: string
          format: date
          description: Date on which the card product expires, if set.
        created_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the card product was created.
        last_modified_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the card product was last modified.
    CardProductListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              description: Array of card product records.
              items:
                $ref: '#/components/schemas/CardProductResponse'
    TransactionResponse:
      type: object
      description: Transaction record returned by the Marqeta Core API.
      properties:
        token:
          type: string
          description: Unique identifier of the transaction.
        type:
          type: string
          description: >-
            Transaction type describing the event (e.g., authorization,
            authorization.clearing, pindebit, refund).
        state:
          type: string
          description: Current state of the transaction.
          enum: [PENDING, COMPLETION, DECLINED, ERROR, ALL, VOID]
        user_token:
          type: string
          description: Token of the user associated with this transaction.
        card_token:
          type: string
          description: Token of the card used in this transaction.
        amount:
          type: number
          format: double
          description: Transaction amount in the currency specified.
        currency_code:
          type: string
          description: ISO 4217 three-letter currency code.
          pattern: '^[A-Z]{3}$'
        card_acceptor:
          type: object
          description: Merchant or card acceptor information.
          properties:
            mid:
              type: string
              description: Merchant identifier.
            mcc:
              type: string
              description: Merchant category code.
            name:
              type: string
              description: Merchant name.
            city:
              type: string
              description: Merchant city.
            state:
              type: string
              description: Merchant state.
            country:
              type: string
              description: Merchant country code.
        response:
          type: object
          description: Authorization response from Marqeta or the issuer.
          properties:
            code:
              type: string
              description: Response code (00 = approved).
            memo:
              type: string
              description: Human-readable response message.
        gpa:
          type: object
          description: GPA balance impact of the transaction.
          properties:
            ledger_balance:
              type: number
              description: Ledger balance after the transaction.
            available_balance:
              type: number
              description: Available balance after the transaction.
            credit_balance:
              type: number
              description: Credit balance after the transaction.
        created_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the transaction was created.
        user_transaction_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the transaction as reported by the card network.
    TransactionListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              description: Array of transaction records.
              items:
                $ref: '#/components/schemas/TransactionResponse'
    BalanceResponse:
      type: object
      description: General purpose account (GPA) balance response.
      properties:
        gpa:
          type: object
          description: GPA balance details for the account holder.
          properties:
            currency_code:
              type: string
              description: ISO 4217 currency code for this balance.
            ledger_balance:
              type: number
              description: Total ledger balance including pending transactions.
            available_balance:
              type: number
              description: Available balance that can be spent.
            credit_balance:
              type: number
              description: Current credit balance.
            pending_credits:
              type: number
              description: Pending credits that have not yet settled.
            impacted_amount:
              type: number
              description: Amount impacted by transactions currently in flight.
        links:
          type: array
          description: Related resources associated with this balance.
          items:
            type: object
    GpaOrderRequest:
      type: object
      description: Request body for creating a GPA funding order.
      required:
        - amount
        - currency_code
        - funding_source_token
        - user_token
      properties:
        token:
          type: string
          description: Optional unique identifier for the GPA order.
        user_token:
          type: string
          description: Token of the user to receive the funds.
        business_token:
          type: string
          description: Token of the business to receive the funds (instead of user_token).
        amount:
          type: number
          format: double
          description: Amount to load onto the cardholder GPA.
          minimum: 0.01
        currency_code:
          type: string
          description: ISO 4217 three-letter currency code.
          pattern: '^[A-Z]{3}$'
        funding_source_token:
          type: string
          description: Token of the funding source to draw from.
        memo:
          type: string
          description: Optional description or memo for this order.
          maxLength: 99
        metadata:
          type: object
          description: Custom metadata for the GPA order.
          additionalProperties:
            type: string
    GpaOrderResponse:
      type: object
      description: GPA order record returned by the Marqeta Core API.
      properties:
        token:
          type: string
          description: Unique identifier of the GPA order.
        amount:
          type: number
          description: Amount loaded.
        currency_code:
          type: string
          description: Currency code of the loaded amount.
        state:
          type: string
          description: Current state of the GPA order.
          enum: [PENDING, COMPLETION, DECLINED, ERROR, VOID]
        user_token:
          type: string
          description: Token of the user that received the funds.
        funding_source_token:
          type: string
          description: Token of the funding source used.
        created_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the order was created.
    GpaOrderListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              description: Array of GPA order records.
              items:
                $ref: '#/components/schemas/GpaOrderResponse'
    AuthControlRequest:
      type: object
      description: Request body for creating or updating an authorization control.
      required:
        - name
        - association
      properties:
        token:
          type: string
          description: Optional unique identifier for the authorization control.
        name:
          type: string
          description: Name of the authorization control.
          maxLength: 40
        association:
          type: object
          description: Association defining what the control applies to.
          properties:
            card_product_token:
              type: string
              description: Apply the control to all cards from this card product.
            user_token:
              type: string
              description: Apply the control to a specific user's cards.
        merchant_scope:
          type: object
          description: Merchant scope defining where the control applies.
          properties:
            mcc:
              type: string
              description: Specific merchant category code to restrict.
            mcc_group:
              type: string
              description: Token of an MCC group to restrict.
            mid:
              type: string
              description: Specific merchant identifier to restrict.
        active:
          type: boolean
          description: Whether the control is active. Defaults to true.
        start_time:
          type: string
          format: date-time
          description: ISO 8601 date-time when the control becomes active.
        end_time:
          type: string
          format: date-time
          description: ISO 8601 date-time when the control expires.
    AuthControlResponse:
      type: object
      description: Authorization control resource returned by the Marqeta Core API.
      properties:
        token:
          type: string
          description: Unique identifier of the authorization control.
        name:
          type: string
          description: Name of the authorization control.
        active:
          type: boolean
          description: Whether the control is currently active.
        created_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the control was created.
        last_modified_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the control was last modified.
    AuthControlListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              description: Array of authorization control records.
              items:
                $ref: '#/components/schemas/AuthControlResponse'
    VelocityControlRequest:
      type: object
      description: Request body for creating or updating a velocity control.
      required:
        - name
        - association
        - velocity_window
      properties:
        token:
          type: string
          description: Optional unique identifier for the velocity control.
        name:
          type: string
          description: Name of the velocity control.
          maxLength: 40
        association:
          type: object
          description: Association defining what the control applies to.
          properties:
            card_product_token:
              type: string
              description: Apply the control to cards from this card product.
            user_token:
              type: string
              description: Apply the control to a specific user's cards.
        velocity_window:
          type: string
          description: Time window over which the velocity limits are measured.
          enum: [DAY, WEEK, MONTH, LIFETIME, TRANSACTION, HOUR]
        amount_limit:
          type: number
          description: Maximum total spend amount within the velocity window.
          minimum: 0
        approvals_only:
          type: boolean
          description: >-
            If true, only approved transactions count toward the velocity
            limit. Defaults to false.
        include_purchases:
          type: boolean
          description: Include purchase transactions in velocity calculations.
        include_withdrawals:
          type: boolean
          description: Include ATM withdrawal transactions in velocity calculations.
        include_transfers:
          type: boolean
          description: Include transfer transactions in velocity calculations.
        include_cashback:
          type: boolean
          description: Include cashback transactions in velocity calculations.
        currency_code:
          type: string
          description: ISO 4217 currency code for the amount limit.
        usage_limit:
          type: integer
          description: Maximum number of transactions within the velocity window.
          minimum: 0
    VelocityControlResponse:
      type: object
      description: Velocity control resource returned by the Marqeta Core API.
      properties:
        token:
          type: string
          description: Unique identifier of the velocity control.
        name:
          type: string
          description: Name of the velocity control.
        velocity_window:
          type: string
          description: Time window for the velocity limits.
        amount_limit:
          type: number
          description: Maximum spend amount within the velocity window.
        usage_limit:
          type: integer
          description: Maximum number of transactions within the velocity window.
        active:
          type: boolean
          description: Whether the control is currently active.
        created_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the control was created.
        last_modified_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the control was last modified.
    VelocityControlListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              description: Array of velocity control records.
              items:
                $ref: '#/components/schemas/VelocityControlResponse'
    WebhookRequest:
      type: object
      description: Request body for creating or updating a webhook configuration.
      required:
        - name
        - config
        - events
      properties:
        token:
          type: string
          description: Optional unique identifier for the webhook.
        name:
          type: string
          description: Descriptive name for the webhook configuration.
          maxLength: 40
        active:
          type: boolean
          description: Whether the webhook is active and delivering events.
          default: true
        config:
          type: object
          description: Endpoint configuration for the webhook.
          required:
            - url
          properties:
            url:
              type: string
              format: uri
              description: HTTPS URL where webhook events will be delivered via POST.
            secret:
              type: string
              description: Shared secret for HMAC signature validation (if configured).
            basic_auth_username:
              type: string
              description: Username for Basic Auth on the webhook endpoint.
            basic_auth_password:
              type: string
              description: Password for Basic Auth on the webhook endpoint.
        events:
          type: array
          description: >-
            Array of event type strings to subscribe to. Supports single
            event types (e.g., transaction.authorization) and wildcard groups
            (e.g., transaction.* or cardtransition.*).
          items:
            type: string
    WebhookResponse:
      type: object
      description: Webhook configuration resource returned by the Marqeta Core API.
      properties:
        token:
          type: string
          description: Unique identifier of the webhook configuration.
        name:
          type: string
          description: Name of the webhook.
        active:
          type: boolean
          description: Whether the webhook is active.
        config:
          type: object
          description: Endpoint configuration.
          properties:
            url:
              type: string
              description: Destination URL for webhook events.
            basic_auth_username:
              type: string
              description: Username for Basic Auth on the endpoint.
        events:
          type: array
          description: Event types subscribed to.
          items:
            type: string
        created_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the webhook was created.
        last_modified_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the webhook was last modified.
    WebhookListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              description: Array of webhook configuration records.
              items:
                $ref: '#/components/schemas/WebhookResponse'
    KycRequest:
      type: object
      description: Request body for submitting a KYC verification.
      required:
        - user_token
      properties:
        token:
          type: string
          description: Optional unique identifier for the KYC record.
        user_token:
          type: string
          description: Token of the user to verify.
        manual_override:
          type: boolean
          description: >-
            If true, manually override the KYC result to PASSED without
