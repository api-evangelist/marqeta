components:
  schemas:
    JournalEntriesPage:
      description: Return filtered transactions.
      properties:
        count:
          description: Number of resources returned.
          maximum: 100
          minimum: 0
          type: integer
        data:
          description: Contains one or more journal entries on a credit account.
          items:
            $ref: '#/components/schemas/JournalEntry'
          maxItems: 100
          minItems: 0
          type: array
        end_index:
          description: Sort order index of the last resource in the returned array.
          type: integer
        is_more:
          description: A value of `true` indicates that more unreturned resources exist.
          type: boolean
        start_index:
          description: Sort order index of the first resource in the returned array.
          type: integer
      required:
      - count
      - data
      - end_index
      - is_more
      - start_index
      type: object
    CurrencyCode:
      default: USD
      description: Valid three-digit link:https://www.iso.org/iso-4217-currency-codes.html[ISO 4217 currency code, window="_blank"].
      enum:
      - USD
      type: string
    JournalEntry:
      description: Contains information about a journal entry.
      properties:
        account_token:
          description: Unique identifier of the credit account associated with the credit card used to make the journal entry.
          format: string
          type: string
        amount:
          description: Amount of the journal entry.
          type: number
        card_token:
          description: Unique identifier of the credit card used to make the journal entry.
          format: string
          maxLength: 36
          minLength: 8
          type: string
        created_time:
          description: Date and time when the journal entry was created on Marqeta's credit platform, in UTC.
          format: date-time
          type: string
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        detail_object:
          type: object
        detail_token:
          description: Unique identifier of the journal entry's full details.
          type: string
        group:
          description: Group to which the journal entry belongs.
          enum:
          - PURCHASE
          - REFUND
          - DISPUTE
          - ORIGINAL_CREDIT
          - FEE
          - REWARD
          - INTEREST
          - PAYMENT
          - ADJUSTMENT
          - BALANCE_TRANSFER
          - CASH_ADVANCE
          - BALANCE_REFUND
          type: string
        id:
          description: Eight-digit numeric identifier of the journal entry, an alternate identifier to the UUID that is useful for remembering and referencing.
          maxLength: 8
          minLength: 8
          type: string
        impact_time:
          description: 'Date and time when the journal entry impacts the account balance.


            For purchases, this is the time of the authorization.


            For purchase authorization clearings, this is the time when the transaction is settled.'
          format: date-time
          type: string
        memo:
          description: Merchant name or description for the journal entry.
          example: Whole Foods Market
          type: string
        metadata:
          additionalProperties:
            type: string
          description: 'Contains key-value pairs with additional information about the journal entry.


            For `DECLINED` and `ERROR` status journal entries, this field contains diagnostic information extracted from the transaction gateway response:


            * `funding.gatewayLog.message` - Gateway decline or error message

            * `funding.gatewayLog.timedOut` - Whether the gateway request timed out ("true" or "false")

            * `funding.gateway.response.code` - Gateway HTTP response code

            * `funding.gateway.response.data.jitFunding.memo` - Additional context from JIT funding

            * `funding.gateway.response.data.jitFunding.declineReason` - Specific decline reason (e.g., "INSUFFICIENT_FUNDS", "CARD_EXPIRED")


            This field is `null` for successful transactions with `PENDING` or `POSTED` status.'
          nullable: true
          type: object
        original_currency:
          $ref: '#/components/schemas/OriginalCurrency'
        program_migration_time:
          description: Date and time when the journal entry was migrated to Marqeta's credit platform, in UTC. Null if not migrated.
          format: date-time
          type: string
        related_token:
          description: 'Unique identifier of the original journal entry.

            If the current journal entry is the original, this field is returned empty.'
          type: string
        request_time:
          description: 'For purchases, the date and time of the authorization, which is when the user initiates the journal entry.


            For other journal entry groups, equivalent to `impact_time`.'
          format: date-time
          type: string
        root_token:
          description: 'Unique identifier of the root journal entry.

            If the current journal entry is the root, this field is returned empty.'
          type: string
        status:
          description: 'Status of the journal entry.

            This field is immutable and may not represent the current status.


            * `PENDING` - Transaction is pending and impacts the account balance.

            * `POSTED` - Transaction is posted and impacts the account balance.

            * `DECLINED` - Transaction was declined and does NOT impact the account balance. These entries are persisted with full details including metadata about the decline reason.

            * `ERROR` - Transaction encountered an error and does NOT impact the account balance. These entries are persisted with full details including metadata about the error.

            * `CLEARED` - Transaction was cleared (final state for certain transaction types).


            To view the current status of purchases, refunds, OCTs, and payments, see the `detail_object.state` field.

            Transactions that start in `PENDING` can transition to `CLEARED`, `DECLINED`, or `ERROR`.

            This transition of status is sent through webhook event notifications.


            Journal entries that are final transactions, such as clearings, start and remain in a `POSTED` state.


            *NOTE*:

            `CLEARED` status does not have an impact on the account balance and is only sent through webhook event notifications.

            For `CLEARED` status, `impact_time`, `request_time`, `created_time`, `token`, and `id` are returned blank.'
          enum:
          - PENDING
          - POSTED
          - DECLINED
          - ERROR
          - CLEARED
          type: string
        token:
          description: Unique identifier of the journal entry.
          type: string
        type:
          description: Journal entry event type.
          example: '`authorization.clearing`'
          type: string
        user_token:
          description: Unique identifier of the credit user.
          type: string
      required:
      - account_token
      - amount
      - created_time
      - currency_code
      - detail_token
      - group
      - id
      - impact_time
      - request_time
      - status
      - token
      - type
      - user_token
      type: object
    OriginalCurrency:
      description: Original Currency
      properties:
        amount:
          description: original amount
          example: 2
          type: number
        code:
          description: Currency code, such as EUR or USD.
          type: string
      type: object
    WebhookEventResendContainerResponse:
      description: Contains information about a webhook event.
      properties:
        unused:
          description: Event notification that was resent to your webhook endpoint.
          type: string
      type: object
    Error:
      properties:
        code:
          type: integer
        message:
          type: string
      type: object
  securitySchemes:
    mqAppAndAccessToken:
      scheme: basic
      type: http
