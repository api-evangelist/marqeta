  name: Marqeta Transactions API
  description: >-
    // Conditional snippet for beta or internal content

    include::../../maturity-admonition-banner.adoc[]


    // This source file is used by InfoDev to generate API reference documentation.

    // File location in GitHub is:

    // https://github.marqeta.com/openapi/coreapi/blob/main/openapi/transactions/openapi.yaml


    The `/transactions` resource represents the electronic messages that carry information used for payment
    processing.

    A transaction usually originates when a cardholder attempts to make a payment, either online or at
    a physical point of sale.


    You can receive information about transactions as they occur by configuring webhooks.

    Learn about configuring webhooks in the <</developer-guides/about-webhooks, About Webhooks>> guide.

    See the transaction events for which you can set up webhooks in the <</core-api/event-types, Event
    Types>> API reference page.


    You can also retrieve transactions associated with specific cards, merchants, and account holders
    using the endpoints described here.


    For an overview of transactions and the `transaction` object, including the complete list of <</developer-guides/about-transactions#_transaction_response_codes,
    transaction response codes>>, see <</developer-guides/about-transactions, About Transactions>>.


    [TIP]

    Use the `/transactions` endpoint to retrieve smaller datasets (up to one page).

    For best performance when requesting larger datasets, use the <</diva-api/introduction, DiVA API>>.
  humanURL: https://www.marqeta.com/docs/core-api
