- aid: marqeta:marqeta-bundles-api
  name: Marqeta Bundles API
  description: >-
    // Conditional snippet for beta or internal content

    include::../../maturity-admonition-banner.adoc[]


    The bundles feature on Marqeta's credit platform enables you to create and manage bundles by choosing
    the specific policies that make up a bundle.

    A bundle must contain one document policy, credit product policy, fee policy, APR policy, and an optional
    reward policy.

    The configurations of each policy in a bundle determine the characteristics and attributes of the
    bundle's associated credit accounts, reward programs, disclosures, and more.

    For more on how to configure a policy, see <</core-api/credit-policies, Policies>>.


    [IMPORTANT]

    ====

    To create and manage bundles, you must use the link:https://app.marqeta.com/[Marqeta Dashboard, window="_blank"].

    For more on bundles in the dashboard, see <</developer-guides/credit-programs-dashboard, Managing
    Credit Programs in the Marqeta Dashboard>>.


    &#160; +


    The following endpoints are displayed for reference purposes only.

    ====
  humanURL: https://www.marqeta.com/docs/core-api
  baseURL: https://sandbox-api.marqeta.com/v3
