aid: marqeta
url: https://raw.githubusercontent.com/api-evangelist/marqeta/refs/heads/main/apis.yml
name: Marqeta
kind: company
description: Marqeta is a modern card-issuing and embedded-finance platform. The Core
  API is a large RESTful surface covering cards, users, businesses, GPA orders, KYC/KYB,
  fee transfer, transactions, real-time decisioning, MCC groups, programs, and webhooks.
  The Diva (Digital Wallets, Tokenization, 3DS) API extends the Core API.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- FinTech
- BaaS
- Card Issuing
- Payments
- Embedded Finance
created: '2026-05-08'
modified: '2026-05-08'
specificationVersion: '0.19'
apis:
- aid: marqeta:core-api
  name: Marqeta Core API
  description: REST API for card issuing, user/business management, GPA funding, transactions,
    authorizations, real-time decisioning, KYC/KYB, MCC controls, programs, and webhooks.
    Customers operate within an isolated 'program' environment.
  humanURL: https://www.marqeta.com/docs/core-api
  baseURL: https://sandbox-api.marqeta.com/v3
  tags:
  - REST
  - Card Issuing
  - Payments
  properties:
  - type: Documentation
    url: https://www.marqeta.com/docs/core-api
  - type: OpenAPI
    url: openapi/marqeta-core-api-openapi.yml
  - url: graphql/marqeta-graphql.md
    type: GraphQL
- aid: marqeta:diva-api
  name: Marqeta Diva API
  description: REST API supplement for Digital Wallets (Apple Pay, Google Pay, Samsung
    Pay) tokenization, push provisioning, and 3-D Secure flows.
  humanURL: https://www.marqeta.com/docs/diva-api
  baseURL: https://sandbox-api.marqeta.com/v3
  tags:
  - REST
  - Digital Wallet
  - Tokenization
  - 3DS
  properties:
  - type: Documentation
    url: https://www.marqeta.com/docs/diva-api
  - type: OpenAPI
    url: openapi/marqeta-diva-api-openapi.yml
- aid: marqeta:webhooks
  name: Marqeta Webhooks
  description: Outbound HTTP webhook delivery for card events, authorization requests,
    advice messages, transactions, and account events.
  humanURL: https://www.marqeta.com/docs/core-api/event-types
  baseURL: https://sandbox-api.marqeta.com/v3/webhooks
  tags:
  - Webhooks
  properties:
  - type: Documentation
    url: https://www.marqeta.com/docs/core-api/event-types
- aid: marqeta:risk-controller
  name: Marqeta Risk Controller / Real-Time Decisioning
  description: Synchronous webhook-style HTTP endpoint customers expose for Marqeta
    to call during card authorization for approve/decline decisions.
  humanURL: https://www.marqeta.com/docs/core-api/real-time-decisioning
  baseURL: customer-hosted
  tags:
  - Webhooks
  - RTD
  properties:
  - type: Documentation
    url: https://www.marqeta.com/docs/core-api/real-time-decisioning
