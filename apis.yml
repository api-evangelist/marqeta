- aid: marqeta:marqeta-account-cards-api
  name: Marqeta Account Cards API
  description: >-
    // Conditional snippet for beta or internal content

    include::../../maturity-admonition-banner.adoc[]


    Use the account cards endpoints to create and retrieve credit cards that can access the credit line
    on a <</core-api/credit-accounts, credit account>>.


    Once a credit card is created, you can use the `/cards` endpoint to <</core-api/cards#putCardsToken,
    update the card>> or <</developer-guides/managing-lost-stolen-or-damaged-cards, manage lost, stolen,
    or damaged cards>>.


    To receive webhook notifications when card transition or card action events occur, see <</core-api/event-types#_card_transition_events,
    Card transition events>> and <</core-api/event-types#_card_action_events, Card action events>> in
    Event Types.
