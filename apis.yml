- aid: marqeta:marqeta-fees-api
  name: Marqeta Fees API
  description: >-
    // Conditional snippet for beta or internal content

    include::../../maturity-admonition-banner.adoc[]


    // This source file is used by InfoDev to generate API reference documentation. File location in GitHub
    is:

    // File location in GitHub is: openapi/fees/openapi.yaml


    A `fees` resource represents a monetary assessment against an account holder's general purpose account
    (GPA).

    Assessing a fee transfers funds from the account holder's GPA account to your program's fee account.

    By default, every account has a GPA account used for the funding of transfers.


    You can assess fees either post-transaction or in real time.

    Real-time fee assessment ensures the account has sufficient funds available to cover both the transaction
    amount and the fee before authorization of the transaction.

    To assess fees in real time, you must create a real-time fee group using the `/realtimefeegroups`
    endpoint.


    When assessing a post-transaction fee, you can either debit existing GPA funds, or pull in new funds
    from a funding source.

    To use existing GPA funds, use the `/feetransfers` endpoint.

    To pull in new funds, use the fees array in `/gpaorders`.


    [NOTE]

    If your program uses Gateway JIT Funding, you cannot assess fees.
