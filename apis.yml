- aid: marqeta:marqeta-velocity-controls-api
  name: Marqeta Velocity Controls API
  description: >-
    // Conditional snippet for beta or internal content

    include::../../maturity-admonition-banner.adoc[]


    A velocity control limits how much users can spend.

    You can configure velocity controls to limit how much users can spend and the number of transactions
    they can make in a given span of time.

    You can apply velocity controls to a single user, to all users associated with a particular card product,
    or to all users in your program.


    Only Program Managers can create or modify program-wide velocity controls.

    A `POST` or `PUT` call from a role that does not have Program Manager permissions will receive a 403
    error if its `association` field is null, or if it includes all of the fields in the request body.

    Avoid this by passing a valid `user_token` or `card_product_token` in the velocity control's `association`
    object, indicating that the request is specific to a user or card product, and not program-wide.

    You should also only include the specific fields you want to update, because a `PUT` or `POST` with
    values for all fields is interpreted as a change that requires Program Manager permissions.


    See <</developer-guides/controlling-spending, Controlling Spending>> for a tutorial that walks you
    through the creation of a spend control.


    [NOTE]

    Each program supports a maximum of 90 spend controls (velocity controls and <</core-api/authorization-controls,
    authorization controls>> combined).

    The limit of 90 spend controls applies at the program level only; it does not affect the number of
    user-level spend controls you can use.
  humanURL: https://www.marqeta.com/docs/core-api
  baseURL: https://sandbox-api.marqeta.com/v3
