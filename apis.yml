- aid: marqeta:marqeta-real-time-fee-groups-api
  name: Marqeta Real-Time Fee Groups API
  description: >-
    Marqeta enables you to assess fees in real time through the use of real-time fee groups.

    A real-time fee group is a collection of fees associated with an account holder group (and thereby
    associated with the users and businesses that are part of that account holder group).

    Real-time fee assessment ensures that associated accounts have sufficient funds available to cover
    both the transaction amount and the fee before authorization of a transaction.


    Before you create a real-time fee group, you must create the individual fees (using the `/fees` endpoint)
    and the account holder group with which you will associate the real-time fee group (using the `/accountholdergroups`
    endpoint).

    Each fee in the group must be applicable to a different transaction type.

    For example, one fee could assess $1 on authorization transactions while another assesses $2 on PIN-debit
    transactions.


    Use of real-time fee groups requires prior approval by Marqeta.

    If you are interested in using this feature for your card program, contact your Marqeta representative
    for more information.


    [NOTE]

    If your program uses Gateway JIT Funding, you cannot assess fees.
