- aid: marqeta:marqeta-credit-substatuses-api
  name: Marqeta Credit Substatuses API
  description: >-
    // Conditional snippet for beta or internal content

    include::../../maturity-admonition-banner.adoc[]


    Credit substatuses can be applied to credit accounts or credit account holders.

    Substatuses should be applied only after verification with Customer Support and after the cardholder
    request for the substatus designation has been accepted.

    Substatuses define specific circumstances, such as bankruptcy, hardship or fraud.

    They also affect account behavior or activity, including interest accrual, authorization requests,
    and account termination.

    Substatus downstream account actions are not always reversible for the cardholder, which means that
    substatuses should be applied with caution.


    Use the substatus endpoints to apply or remove a substatus for a credit account or user.

    Applying a substatus causes immediate downstream changes to the account.

    For additional information about substatuses, see <</developer-guides/about-credit-accounts#_account-substatuses,Account
    substatuses>> or <</developer-guides/about-credit-accounts#_account-holder-substatuses,Account holder
    substatuses>> in the <</developer-guides/about-credit-accounts,About Credit Accounts>> guide.


    [NOTE]

    ====

    The substatus `SCRA` stands for "Servicemembers Civilian Relief Act."

    The substatus `MLA` stands for "Military Lending Act."

    ====


    For more information about receiving webhook notifications when account transition events occur, see
    <</core-api/event-types#_credit-substatus-events,Credit substatus events>> on the <</core-api/event-types,Event
    Types>> page.


    [IMPORTANT]

    ====

    If you are a Managed by Marqeta customer, a Marqeta customer service representative will apply the
    appropriate substatuses.

    ====
