- aid: marqeta:marqeta-webhooks-api
  name: Marqeta Webhooks API
  description: >-
    // Conditional snippet for beta or internal content

    include::../../maturity-admonition-banner.adoc[]


    Webhooks are notifications about API events, sent as they occur.

    The Marqeta platform sends these notifications to an endpoint that is hosted in your environment and
    configured to receive and process them.


    Create a webhook object to represent your webhook endpoint.

    Configure it with the URL of your webhook endpoint and a set of credentials for accessing that endpoint.

    You can configure it to send notifications for a single event, a group of events by type, or all event
    types.

    To set up multiple webhook endpoints and route different types of event notifications to each, create
    multiple webhook objects and configure each to send a specific type of event notification to a specific
    endpoint.


    See <</developer-guides/about-webhooks, About Webhooks>> for information on notifications and a tutorial
    that walks you through the configuration of your webhook endpoint.


    See <</core-api/event-types, Event Types>> for reference documentation on the types of events that
    the Marqeta platform supports.


    [NOTE]

    Webhooks URLs are cached.

    Changes made on your webhook endpoint can take up to one hour to be applied.
