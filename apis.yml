- aid: marqeta:marqeta-account-rewards-api
  name: Marqeta Account Rewards API
  description: >-
    // Conditional snippet for beta or internal content

    include::../../maturity-admonition-banner.adoc[]


    Use the `/credit/accounts/{account_token}/rewards` endpoint to create a one-time reward on a <</core-api/credit-accounts,
    credit account>>.


    Creating a reward triggers the creation of a <</core-api/credit-account-journal-entries, journal entry>>
    belonging to the `REWARD` group.

    For more on reward journal entries, see <</developer-guides/about-credit-account-journal-entries#_rewards,
    Rewards>> in the About Credit Account Journal Entries guide.


    For the reward programs that are associated with a reward policy on a bundle, see <</developer-guides/about-credit-reward-accounts/,
    About Credit Reward Accounts>> and <</core-api/credit-reward-global-configurations/, Reward Global
    Configurations>>.
  humanURL: https://www.marqeta.com/docs/core-api
  baseURL: https://sandbox-api.marqeta.com/v3
