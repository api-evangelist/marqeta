naftiko: 1.0.0-alpha2
info:
  label: Core API — Adjustments
  description: 'Core API — Adjustments. 3 operations. Lead operation: List account adjustments. Self-contained Naftiko capability
    covering one Marqeta business surface.'
  tags:
  - Marqeta
  - Adjustments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-adjustments
    baseUri: ''
    description: Core API — Adjustments business capability. Self-contained, no shared references.
    resources:
    - name: accounts-account_token-adjustments
      path: /accounts/{account_token}/adjustments
      operations:
      - name: getadjustmentsbyaccount
        method: GET
        description: List account adjustments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: account_token
          in: path
          type: string
          description: Unique identifier of the credit account for which you want to retrieve adjustments.
          required: true
        - name: count
          in: query
          type: integer
          description: Number of account adjustment resources to retrieve.
        - name: start_index
          in: query
          type: integer
          description: Sort order index of the first resource in the returned array.
      - name: createadjustmentforaccount
        method: POST
        description: Create account adjustment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: account_token
          in: path
          type: string
          description: Unique identifier of the credit account for which you want to create an adjustment.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: accounts-account_token-adjustments-adjustment_token
      path: /accounts/{account_token}/adjustments/{adjustment_token}
      operations:
      - name: retrieveadjustment
        method: GET
        description: Retrieve account adjustment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: account_token
          in: path
          type: string
          description: Unique identifier of the credit account for which you want to retrieve an adjustment.
          required: true
        - name: adjustment_token
          in: path
          type: string
          description: Unique identifier of the adjustment to retrieve.
          required: true
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: core-adjustments-rest
    port: 8080
    description: REST adapter for Core API — Adjustments. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/accounts/{account-token}/adjustments
      name: accounts-account-token-adjustments
      description: REST surface for accounts-account_token-adjustments.
      operations:
      - method: GET
        name: getadjustmentsbyaccount
        description: List account adjustments
        call: core-adjustments.getadjustmentsbyaccount
        with:
          account_token: rest.account_token
          count: rest.count
          start_index: rest.start_index
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createadjustmentforaccount
        description: Create account adjustment
        call: core-adjustments.createadjustmentforaccount
        with:
          account_token: rest.account_token
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accounts/{account-token}/adjustments/{adjustment-token}
      name: accounts-account-token-adjustments-adjustment-token
      description: REST surface for accounts-account_token-adjustments-adjustment_token.
      operations:
      - method: GET
        name: retrieveadjustment
        description: Retrieve account adjustment
        call: core-adjustments.retrieveadjustment
        with:
          account_token: rest.account_token
          adjustment_token: rest.adjustment_token
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-adjustments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — Adjustments. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-account-adjustments
      description: List account adjustments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-adjustments.getadjustmentsbyaccount
      with:
        account_token: tools.account_token
        count: tools.count
        start_index: tools.start_index
      outputParameters:
      - type: object
        mapping: $.
    - name: create-account-adjustment
      description: Create account adjustment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-adjustments.createadjustmentforaccount
      with:
        account_token: tools.account_token
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-account-adjustment
      description: Retrieve account adjustment
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-adjustments.retrieveadjustment
      with:
        account_token: tools.account_token
        adjustment_token: tools.adjustment_token
      outputParameters:
      - type: object
        mapping: $.
