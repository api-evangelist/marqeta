naftiko: 1.0.0-alpha2
info:
  label: Marqeta Core API
  description: The Marqeta Core API is a RESTful interface that enables developers to build and manage card payment programs
    programmatically. It provides endpoints for creating and managing users (cardholders) and businesses, issuing physical
    and virtual payment cards, defining spending controls via authorization controls and velocity controls, processing and
    retrieving transactions, managing funding sources, and configuring webhooks for real-time event notifications. The API
    supports use cases including prepaid cards, expense management, earned wage access, buy now pay later programs, and credit
    card issua
  tags:
  - Marqeta
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
