naftiko: 1.0.0-alpha2
info:
  label: Core API — accepted countries
  description: 'Core API — accepted countries. 2 operations. Lead operation: Lists all accepted countries. Self-contained
    Naftiko capability covering one Marqeta business surface.'
  tags:
  - Marqeta
  - accepted countries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-accepted-countries
    baseUri: ''
    description: Core API — accepted countries business capability. Self-contained, no shared references.
    resources:
    - name: acceptedcountries
      path: /acceptedcountries
      operations:
      - name: getacceptedcountries
        method: GET
        description: Lists all accepted countries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: count
          in: query
          type: integer
          description: Number of accepted countries to retrieve
        - name: start_index
          in: query
          type: integer
          description: Start index
        - name: name
          in: query
          type: string
          description: Name
        - name: whitelist
          in: query
          type: boolean
          description: Whitelist
        - name: search_type
          in: query
          type: string
          description: Search type
        - name: fields
          in: query
          type: string
          description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
        - name: sort_by
          in: query
          type: string
          description: Sort order
    - name: acceptedcountries-token
      path: /acceptedcountries/{token}
      operations:
      - name: getacceptedcountriestoken
        method: GET
        description: Returns a specific accepted country
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Accepted country token
          required: true
        - name: fields
          in: query
          type: string
          description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: core-accepted-countries-rest
    port: 8080
    description: REST adapter for Core API — accepted countries. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/acceptedcountries
      name: acceptedcountries
      description: REST surface for acceptedcountries.
      operations:
      - method: GET
        name: getacceptedcountries
        description: Lists all accepted countries
        call: core-accepted-countries.getacceptedcountries
        with:
          count: rest.count
          start_index: rest.start_index
          name: rest.name
          whitelist: rest.whitelist
          search_type: rest.search_type
          fields: rest.fields
          sort_by: rest.sort_by
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/acceptedcountries/{token}
      name: acceptedcountries-token
      description: REST surface for acceptedcountries-token.
      operations:
      - method: GET
        name: getacceptedcountriestoken
        description: Returns a specific accepted country
        call: core-accepted-countries.getacceptedcountriestoken
        with:
          token: rest.token
          fields: rest.fields
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-accepted-countries-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — accepted countries. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: lists-all-accepted-countries
      description: Lists all accepted countries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-accepted-countries.getacceptedcountries
      with:
        count: tools.count
        start_index: tools.start_index
        name: tools.name
        whitelist: tools.whitelist
        search_type: tools.search_type
        fields: tools.fields
        sort_by: tools.sort_by
      outputParameters:
      - type: object
        mapping: $.
    - name: returns-specific-accepted-country
      description: Returns a specific accepted country
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-accepted-countries.getacceptedcountriestoken
      with:
        token: tools.token
        fields: tools.fields
      outputParameters:
      - type: object
        mapping: $.
