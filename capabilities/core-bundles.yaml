    - name: clone-bundle
      description: Clone bundle
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-bundles.clonebundle
      with:
        token: tools.token
      outputParameters:
      - type: object
        mapping: $.
    - name: list-related-bundles
      description: List related bundles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-bundles.listrelatedbundles
      with:
        token: tools.token
        count: tools.count
        start_index: tools.start_index
        sort_by: tools.sort_by
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
    - name: promote-bundle
      description: Promote bundle
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: core-bundles.promotebundle
      with:
        token: tools.token
      outputParameters:
      - type: object
        mapping: $.
    - name: transition-bundle
      description: Transition a bundle
      hints:
