        count: tools.count
        start_index: tools.start_index
        sort_by: tools.sort_by
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
    - name: create-bundle
      description: Create bundle
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-bundles.createbundle
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-bundle
      description: Retrieve bundle
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-bundles.retrievebundle
      with:
        token: tools.token
        expand_objects: tools.expand_objects
      outputParameters:
      - type: object
        mapping: $.
    - name: update-bundle
      description: Update bundle
      hints:
