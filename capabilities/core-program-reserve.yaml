naftiko: 1.0.0-alpha2
info:
  label: Core API — Program Reserve
  description: 'Core API — Program Reserve. 2 operations. Lead operation: Retrieve reserve account balances. Self-contained
    Naftiko capability covering one Marqeta business surface.'
  tags:
  - Marqeta
  - Program Reserve
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-program-reserve
    baseUri: ''
    description: Core API — Program Reserve business capability. Self-contained, no shared references.
    resources:
    - name: programreserve-balances
      path: /programreserve/balances
      operations:
      - name: getprogramreservebalances
        method: GET
        description: Retrieve reserve account balances
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: programreserve-transactions
      path: /programreserve/transactions
      operations:
      - name: getprogramreservetransactions
        method: GET
        description: List program reserve transactions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: count
          in: query
          type: integer
          description: Number of resources to retrieve.
        - name: start_index
          in: query
          type: integer
          description: Sort order index of the first resource in the returned array.
        - name: sort_by
          in: query
          type: string
          description: Field on which to sort.
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: core-program-reserve-rest
    port: 8080
    description: REST adapter for Core API — Program Reserve. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/programreserve/balances
      name: programreserve-balances
      description: REST surface for programreserve-balances.
      operations:
      - method: GET
        name: getprogramreservebalances
        description: Retrieve reserve account balances
        call: core-program-reserve.getprogramreservebalances
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/programreserve/transactions
      name: programreserve-transactions
      description: REST surface for programreserve-transactions.
      operations:
      - method: GET
        name: getprogramreservetransactions
        description: List program reserve transactions
        call: core-program-reserve.getprogramreservetransactions
        with:
          count: rest.count
          start_index: rest.start_index
          sort_by: rest.sort_by
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-program-reserve-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — Program Reserve. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: retrieve-reserve-account-balances
      description: Retrieve reserve account balances
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-program-reserve.getprogramreservebalances
      outputParameters:
      - type: object
        mapping: $.
    - name: list-program-reserve-transactions
      description: List program reserve transactions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-program-reserve.getprogramreservetransactions
      with:
        count: tools.count
        start_index: tools.start_index
        sort_by: tools.sort_by
      outputParameters:
      - type: object
        mapping: $.
