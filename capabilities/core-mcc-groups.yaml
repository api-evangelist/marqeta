naftiko: 1.0.0-alpha2
info:
  label: Core API — mcc groups
  description: 'Core API — mcc groups. 4 operations. Lead operation: Lists all MCC groups. Self-contained Naftiko capability
    covering one Marqeta business surface.'
  tags:
  - Marqeta
  - mcc groups
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-mcc-groups
    baseUri: ''
    description: Core API — mcc groups business capability. Self-contained, no shared references.
    resources:
    - name: mccgroups
      path: /mccgroups
      operations:
      - name: getmccgroups
        method: GET
        description: Lists all MCC groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: mcc
          in: query
          type: string
          description: MCC
        - name: count
          in: query
          type: integer
          description: Number of items to retrieve. Count can be between 1 - 10 items.
        - name: start_index
          in: query
          type: integer
          description: Indicates from what row to start returning data.
        - name: sort_by
          in: query
          type: string
          description: Field by which to sort the returned items. Use any field in the model, or system fields lastModifiedTime
            or createdTime.
      - name: postmccgroups
        method: POST
        description: Creates an MCC group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: mccgroups-token
      path: /mccgroups/{token}
      operations:
      - name: getmccgroupstoken
        method: GET
        description: Returns a specific MCC group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: MCC group token
          required: true
      - name: putmccgroupstoken
        method: PUT
        description: Updates an MCC group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: core-mcc-groups-rest
    port: 8080
    description: REST adapter for Core API — mcc groups. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/mccgroups
      name: mccgroups
      description: REST surface for mccgroups.
      operations:
      - method: GET
        name: getmccgroups
        description: Lists all MCC groups
        call: core-mcc-groups.getmccgroups
        with:
          mcc: rest.mcc
          count: rest.count
          start_index: rest.start_index
          sort_by: rest.sort_by
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postmccgroups
        description: Creates an MCC group
        call: core-mcc-groups.postmccgroups
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/mccgroups/{token}
      name: mccgroups-token
      description: REST surface for mccgroups-token.
      operations:
      - method: GET
        name: getmccgroupstoken
        description: Returns a specific MCC group
        call: core-mcc-groups.getmccgroupstoken
        with:
          token: rest.token
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putmccgroupstoken
        description: Updates an MCC group
        call: core-mcc-groups.putmccgroupstoken
        with:
          token: rest.token
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-mcc-groups-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — mcc groups. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: lists-all-mcc-groups
      description: Lists all MCC groups
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-mcc-groups.getmccgroups
      with:
        mcc: tools.mcc
        count: tools.count
        start_index: tools.start_index
        sort_by: tools.sort_by
      outputParameters:
      - type: object
        mapping: $.
    - name: creates-mcc-group
      description: Creates an MCC group
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-mcc-groups.postmccgroups
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: returns-specific-mcc-group
      description: Returns a specific MCC group
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-mcc-groups.getmccgroupstoken
      with:
        token: tools.token
      outputParameters:
      - type: object
        mapping: $.
    - name: updates-mcc-group
      description: Updates an MCC group
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: core-mcc-groups.putmccgroupstoken
      with:
        token: tools.token
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
