naftiko: 1.0.0-alpha2
info:
  label: Core API — businesses
  description: 'Core API — businesses. 14 operations. Lead operation: Lists all businesses. Self-contained Naftiko capability
    covering one Marqeta business surface.'
  tags:
  - Marqeta
  - businesses
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-businesses
    baseUri: ''
    description: Core API — businesses business capability. Self-contained, no shared references.
    resources:
    - name: businesses
      path: /businesses
      operations:
      - name: getbusinesses
        method: GET
        description: Lists all businesses
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: count
          in: query
          type: integer
          description: Number of users to retrieve
        - name: start_index
          in: query
          type: integer
          description: Start index
        - name: business_name_dba
          in: query
          type: string
          description: Business name DBA
        - name: business_name_legal
          in: query
          type: string
          description: Business name legal
        - name: search_type
          in: query
          type: string
          description: Search type
        - name: fields
          in: query
          type: string
          description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
        - name: sort_by
          in: query
          type: string
          description: Sort order
      - name: postbusinesses
        method: POST
        description: Creates a business
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: businesses-lookup
      path: /businesses/lookup
      operations:
      - name: postbusinesseslookup
        method: POST
        description: Returns a specific business
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: businesses-business_token-directors
      path: /businesses/{business_token}/directors
      operations:
      - name: postbusinessestokendirectors
        method: POST
        description: Creates a BusinessDirector for a business
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: business_token
          in: path
          type: string
          description: Business token
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: businesses-business_token-directors-token
      path: /businesses/{business_token}/directors/{token}
      operations:
      - name: getbusinessdirectortoken
        method: GET
        description: Returns a specific business director
