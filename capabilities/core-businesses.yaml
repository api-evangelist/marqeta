      - name: putbusinessestoken
        method: PUT
        description: Updates a specific business
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Business token
          required: true
