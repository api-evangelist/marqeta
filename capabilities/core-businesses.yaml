          description: Business token
          required: true
        - name: token
          in: path
          type: string
          description: Business Director token
          required: true
        - name: fields
          in: query
          type: string
          description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
      - name: putbusinessestokenbusinessdirectortoken
        method: PUT
        description: Updates a specific business director for a business
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: business_token
          in: path
          type: string
          description: Business token
          required: true
        - name: token
          in: path
          type: string
          description: Business Director token
          required: true
