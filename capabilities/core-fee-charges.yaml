naftiko: 1.0.0-alpha2
info:
  label: Core API — fee charges
  description: 'Core API — fee charges. 3 operations. Lead operation: Creates a fee charge. Self-contained Naftiko capability
    covering one Marqeta business surface.'
  tags:
  - Marqeta
  - fee charges
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-fee-charges
    baseUri: ''
    description: Core API — fee charges business capability. Self-contained, no shared references.
    resources:
    - name: feecharges
      path: /feecharges
      operations:
      - name: postfeecharge
        method: POST
        description: Creates a fee charge
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: feecharges-realtime
      path: /feecharges/realtime
      operations:
      - name: postrealtimefeecharge
        method: POST
        description: Creates a realTime fee charge
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: feecharges-token
      path: /feecharges/{token}
      operations:
      - name: getfeechargetoken
        method: GET
        description: Returns a fee charge
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          required: true
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: core-fee-charges-rest
    port: 8080
    description: REST adapter for Core API — fee charges. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/feecharges
      name: feecharges
      description: REST surface for feecharges.
      operations:
      - method: POST
        name: postfeecharge
        description: Creates a fee charge
        call: core-fee-charges.postfeecharge
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/feecharges/realtime
      name: feecharges-realtime
      description: REST surface for feecharges-realtime.
      operations:
      - method: POST
        name: postrealtimefeecharge
        description: Creates a realTime fee charge
        call: core-fee-charges.postrealtimefeecharge
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/feecharges/{token}
      name: feecharges-token
      description: REST surface for feecharges-token.
      operations:
      - method: GET
        name: getfeechargetoken
        description: Returns a fee charge
        call: core-fee-charges.getfeechargetoken
        with:
          token: rest.token
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-fee-charges-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — fee charges. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: creates-fee-charge
      description: Creates a fee charge
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-fee-charges.postfeecharge
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: creates-realtime-fee-charge
      description: Creates a realTime fee charge
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-fee-charges.postrealtimefeecharge
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: returns-fee-charge
      description: Returns a fee charge
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-fee-charges.getfeechargetoken
      with:
        token: tools.token
      outputParameters:
      - type: object
        mapping: $.
