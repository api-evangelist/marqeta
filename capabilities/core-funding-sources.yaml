      operations:
      - name: postfundingsourcesach
        method: POST
        description: Registers an ACH funding source
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: fundingsources-ach-partner
