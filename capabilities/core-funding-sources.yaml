      - name: postfundingsourcesachpartner
        method: POST
        description: Registers an ACH funding source through a partner
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
