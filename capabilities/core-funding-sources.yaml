        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: funding_source_token
          in: path
          type: string
          description: Funding account token
          required: true
      - name: putfundingsourcesachfundingsourcetoken
        method: PUT
        description: Verifies a bank account as a funding source
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: funding_source_token
          in: path
          type: string
          required: true
        - name: body
