        description: Retrieves a linked funding source balance from a partner
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: funding_source_token
          in: path
          type: string
          description: Funding source token
          required: true
    - name: fundingsources-ach-funding_source_token
