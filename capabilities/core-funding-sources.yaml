naftiko: 1.0.0-alpha2
info:
  label: Core API — funding sources
  description: 'Core API — funding sources. 26 operations. Lead operation: Registers an ACH funding source. Self-contained
    Naftiko capability covering one Marqeta business surface.'
  tags:
  - Marqeta
  - funding sources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
