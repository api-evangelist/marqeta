naftiko: 1.0.0-alpha2
info:
  label: Core API — Account
  description: 'Core API — Account. 2 operations. Lead operation: Get billing cycle by account token. Self-contained Naftiko
    capability covering one Marqeta business surface.'
  tags:
  - Marqeta
  - Account
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-account
    baseUri: ''
    description: Core API — Account business capability. Self-contained, no shared references.
    resources:
    - name: accounts-account_token-billingcycle
      path: /accounts/{account_token}/billingcycle
      operations:
      - name: retrievebillingcycleforaccount
        method: GET
        description: Get billing cycle by account token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: account_token
          in: path
          type: string
          description: Unique identifier of the credit account for which you want to retrieve delinquency state details.
          required: true
    - name: accounts-account_token-periodicfeeschedules
      path: /accounts/{account_token}/periodicfeeschedules
      operations:
      - name: getperiodicfeeschedules
        method: GET
        description: Get all active and upcoming periodic fee schedules of an account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: account_token
          in: path
          type: string
          description: account token
          required: true
        - name: count
          in: query
          type: integer
          description: Number of periodic fee schedule resources to retrieve.
        - name: start_index
          in: query
          type: integer
          description: Sort order index of the first resource in the returned array.
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: core-account-rest
    port: 8080
    description: REST adapter for Core API — Account. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/accounts/{account-token}/billingcycle
      name: accounts-account-token-billingcycle
      description: REST surface for accounts-account_token-billingcycle.
      operations:
      - method: GET
        name: retrievebillingcycleforaccount
        description: Get billing cycle by account token
        call: core-account.retrievebillingcycleforaccount
        with:
          account_token: rest.account_token
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accounts/{account-token}/periodicfeeschedules
      name: accounts-account-token-periodicfeeschedules
      description: REST surface for accounts-account_token-periodicfeeschedules.
      operations:
      - method: GET
        name: getperiodicfeeschedules
        description: Get all active and upcoming periodic fee schedules of an account
        call: core-account.getperiodicfeeschedules
        with:
          account_token: rest.account_token
          count: rest.count
          start_index: rest.start_index
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-account-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — Account. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-billing-cycle-account-token
      description: Get billing cycle by account token
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-account.retrievebillingcycleforaccount
      with:
        account_token: tools.account_token
      outputParameters:
      - type: object
        mapping: $.
    - name: get-all-active-and-upcoming
      description: Get all active and upcoming periodic fee schedules of an account
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-account.getperiodicfeeschedules
      with:
        account_token: tools.account_token
        count: tools.count
        start_index: tools.start_index
      outputParameters:
      - type: object
        mapping: $.
