naftiko: 1.0.0-alpha2
info:
  label: Core API — Account Signup Bonus
  description: 'Core API — Account Signup Bonus. 1 operations. Lead operation: Resend credit event notification. Self-contained
    Naftiko capability covering one Marqeta business surface.'
  tags:
  - Marqeta
  - Account Signup Bonus
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-account-signup-bonus
    baseUri: ''
    description: Core API — Account Signup Bonus business capability. Self-contained, no shared references.
    resources:
    - name: webhooks-event_type-resource_token
      path: /webhooks/{event_type}/{resource_token}
      operations:
      - name: resendwebhookevent
        method: POST
        description: Resend credit event notification
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: event_type
          in: path
          type: string
          description: Specifies the type of event you want to resend.
          required: true
        - name: resource_token
          in: path
          type: string
          description: Unique identifier of the resource for which you want to resend a notification.
          required: true
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: core-account-signup-bonus-rest
    port: 8080
    description: REST adapter for Core API — Account Signup Bonus. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/webhooks/{event-type}/{resource-token}
      name: webhooks-event-type-resource-token
      description: REST surface for webhooks-event_type-resource_token.
      operations:
      - method: POST
        name: resendwebhookevent
        description: Resend credit event notification
        call: core-account-signup-bonus.resendwebhookevent
        with:
          event_type: rest.event_type
          resource_token: rest.resource_token
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-account-signup-bonus-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — Account Signup Bonus. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: resend-credit-event-notification
      description: Resend credit event notification
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-account-signup-bonus.resendwebhookevent
      with:
        event_type: tools.event_type
        resource_token: tools.resource_token
      outputParameters:
      - type: object
        mapping: $.
