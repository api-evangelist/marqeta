      call: core-cards.putcardstoken
      with:
        token: tools.token
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: returns-specific-card-pan-visible
      description: Returns a specific card - PAN visible
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-cards.getcardstokenshowpan
      with:
        token: tools.token
        fields: tools.fields
        show_cvv_number: tools.show_cvv_number
      outputParameters:
      - type: object
