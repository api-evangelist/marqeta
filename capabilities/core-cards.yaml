naftiko: 1.0.0-alpha2
info:
  label: Core API — cards
  description: 'Core API — cards. 13 operations. Lead operation: Lists cards by the last 4 digits. Self-contained Naftiko
    capability covering one Marqeta business surface.'
  tags:
  - Marqeta
  - cards
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-cards
    baseUri: ''
    description: Core API — cards business capability. Self-contained, no shared references.
    resources:
    - name: cards
      path: /cards
      operations:
      - name: getcards
        method: GET
        description: Lists cards by the last 4 digits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: count
          in: query
          type: integer
          description: Number of cards to retrieve
        - name: start_index
          in: query
          type: integer
          description: Start index
        - name: last_four
          in: query
          type: string
          description: Last four digits of card number
          required: true
        - name: fields
          in: query
          type: string
          description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
        - name: sort_by
          in: query
          type: string
          description: Sort order
      - name: postcards
        method: POST
        description: Creates a card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: show_cvv_number
          in: query
          type: boolean
          description: Show CVV
        - name: show_pan
          in: query
          type: boolean
          description: Show PAN
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: cards-barcode-barcode
      path: /cards/barcode/{barcode}
      operations:
      - name: getcardsbarcodebarcode
        method: GET
        description: Returns a card's metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: barcode
          in: path
          type: string
          description: Barcode
          required: true
        - name: fields
          in: query
          type: string
          description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
    - name: cards-getbypan
      path: /cards/getbypan
      operations:
      - name: postcardsgetbypan
        method: POST
        description: Returns user and card tokens for the specified PAN
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: cards-user-token
      path: /cards/user/{token}
      operations:
      - name: getcardsusertoken
        method: GET
        description: Lists all cards for a specific user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: User token
          required: true
        - name: count
          in: query
          type: integer
          description: Number of items to retrieve
        - name: start_index
          in: query
          type: integer
          description: Start index
        - name: fields
          in: query
          type: string
          description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
        - name: sort_by
          in: query
          type: string
          description: Sort order
    - name: cards-token
      path: /cards/{token}
      operations:
      - name: getcardstoken
        method: GET
        description: Returns a specific card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Card token
          required: true
        - name: fields
          in: query
          type: string
          description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
        - name: expand
          in: query
          type: string
          description: Object to expand
      - name: putcardstoken
        method: PUT
        description: Updates a specific card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Card token
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: cards-token-showpan
      path: /cards/{token}/showpan
      operations:
      - name: getcardstokenshowpan
        method: GET
        description: Returns a specific card - PAN visible
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Card token
          required: true
        - name: fields
          in: query
          type: string
          description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
        - name: show_cvv_number
          in: query
          type: boolean
    - name: cards-token-stoporders
      path: /cards/{token}/stoporders
      operations:
      - name: getstoporders
        method: GET
        description: Lists all stop orders for a card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Card token
          required: true
        - name: count
          in: query
          type: integer
          description: Number of stop orders to retrieve
        - name: start_index
          in: query
          type: integer
          description: Start index
      - name: poststoporders
        method: POST
        description: Creates a stop order for a card transaction
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Card token
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: cards-token-stoporders-stop_order_token
      path: /cards/{token}/stoporders/{stop_order_token}
      operations:
      - name: getstoporder
        method: GET
        description: Retrieves a specific stop order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Card token
          required: true
        - name: stop_order_token
          in: path
          type: string
          description: Stop order token
          required: true
      - name: putstoporders
        method: PUT
        description: Updates a stop order by token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Card token
          required: true
        - name: stop_order_token
          in: path
          type: string
          description: Stop order token
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: cards-token-transactions
      path: /cards/{token}/transactions
      operations:
      - name: getcardtransactions
        method: GET
        description: Returns transactions for a specific card
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: count
          in: query
          type: integer
          description: Number of transactions to retrieve
        - name: start_index
          in: query
          type: integer
          description: Start index
        - name: token
          in: path
          type: string
          description: Card token
          required: true
        - name: user_token
          in: query
          type: string
          description: User token
        - name: start_date
          in: query
          type: string
          description: Start date (yyyy-MM-dd | yyyy-MM-ddTHH:mm:ss.SS)
        - name: end_date
          in: query
          type: string
          description: End date (yyyy-MM-dd | yyyy-MM-ddTHH:mm:ss.SS)
        - name: is_recurring
          in: query
          type: boolean
          description: Filter by recurring transaction flag
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: core-cards-rest
    port: 8080
    description: REST adapter for Core API — cards. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/cards
      name: cards
      description: REST surface for cards.
      operations:
      - method: GET
        name: getcards
        description: Lists cards by the last 4 digits
        call: core-cards.getcards
        with:
          count: rest.count
          start_index: rest.start_index
          last_four: rest.last_four
          fields: rest.fields
          sort_by: rest.sort_by
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postcards
        description: Creates a card
        call: core-cards.postcards
        with:
          show_cvv_number: rest.show_cvv_number
          show_pan: rest.show_pan
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cards/barcode/{barcode}
      name: cards-barcode-barcode
      description: REST surface for cards-barcode-barcode.
      operations:
      - method: GET
        name: getcardsbarcodebarcode
        description: Returns a card's metadata
        call: core-cards.getcardsbarcodebarcode
        with:
          barcode: rest.barcode
          fields: rest.fields
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cards/getbypan
      name: cards-getbypan
      description: REST surface for cards-getbypan.
      operations:
      - method: POST
        name: postcardsgetbypan
        description: Returns user and card tokens for the specified PAN
        call: core-cards.postcardsgetbypan
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cards/user/{token}
      name: cards-user-token
      description: REST surface for cards-user-token.
      operations:
      - method: GET
        name: getcardsusertoken
        description: Lists all cards for a specific user
        call: core-cards.getcardsusertoken
        with:
          token: rest.token
          count: rest.count
          start_index: rest.start_index
          fields: rest.fields
          sort_by: rest.sort_by
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cards/{token}
      name: cards-token
      description: REST surface for cards-token.
      operations:
      - method: GET
        name: getcardstoken
        description: Returns a specific card
        call: core-cards.getcardstoken
        with:
          token: rest.token
          fields: rest.fields
          expand: rest.expand
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putcardstoken
        description: Updates a specific card
        call: core-cards.putcardstoken
        with:
          token: rest.token
