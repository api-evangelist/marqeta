naftiko: 1.0.0-alpha2
info:
  label: Core API — Program Gateways
  description: 'Core API — Program Gateways. 4 operations. Lead operation: List Program Gateways. Self-contained Naftiko capability
    covering one Marqeta business surface.'
  tags:
  - Marqeta
  - Program Gateways
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-program-gateways
    baseUri: ''
    description: Core API — Program Gateways business capability. Self-contained, no shared references.
    resources:
    - name: programgateways
      path: /programgateways
      operations:
      - name: listprogramgateways
        method: GET
        description: List Program Gateways
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: count
          in: query
          type: integer
          description: Number of Program Gateway resources to retrieve.
        - name: start_index
          in: query
          type: integer
          description: Sort order index of the first resource in the returned array.
        - name: sort_by
          in: query
          type: string
          description: Field on which to sort.
      - name: createprogramgateway
        method: POST
        description: Create Program Gateway
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: programgateways-token
      path: /programgateways/{token}
      operations:
      - name: retrieveprogramgateway
        method: GET
        description: Retrieve Program Gateway
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Unique identifier of the Program Gateway to retrieve.
          required: true
      - name: updateprogramgateway
        method: PUT
        description: Update Program Gateway
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Unique identifier of the Program Gateway to update.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: core-program-gateways-rest
    port: 8080
    description: REST adapter for Core API — Program Gateways. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/programgateways
      name: programgateways
      description: REST surface for programgateways.
      operations:
      - method: GET
        name: listprogramgateways
        description: List Program Gateways
        call: core-program-gateways.listprogramgateways
        with:
          count: rest.count
          start_index: rest.start_index
          sort_by: rest.sort_by
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createprogramgateway
        description: Create Program Gateway
        call: core-program-gateways.createprogramgateway
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/programgateways/{token}
      name: programgateways-token
      description: REST surface for programgateways-token.
      operations:
      - method: GET
        name: retrieveprogramgateway
        description: Retrieve Program Gateway
        call: core-program-gateways.retrieveprogramgateway
        with:
          token: rest.token
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateprogramgateway
        description: Update Program Gateway
        call: core-program-gateways.updateprogramgateway
        with:
          token: rest.token
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-program-gateways-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — Program Gateways. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-program-gateways
      description: List Program Gateways
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-program-gateways.listprogramgateways
      with:
        count: tools.count
        start_index: tools.start_index
        sort_by: tools.sort_by
      outputParameters:
      - type: object
        mapping: $.
    - name: create-program-gateway
      description: Create Program Gateway
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-program-gateways.createprogramgateway
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-program-gateway
      description: Retrieve Program Gateway
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-program-gateways.retrieveprogramgateway
      with:
        token: tools.token
      outputParameters:
      - type: object
        mapping: $.
    - name: update-program-gateway
      description: Update Program Gateway
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: core-program-gateways.updateprogramgateway
      with:
        token: tools.token
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
