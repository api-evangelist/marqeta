naftiko: 1.0.0-alpha2
info:
  label: Core API — Credit Products
  description: 'Core API — Credit Products. 4 operations. Lead operation: List credit products. Self-contained Naftiko capability
    covering one Marqeta business surface.'
  tags:
  - Marqeta
  - Credit Products
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-credit-products
    baseUri: ''
    description: Core API — Credit Products business capability. Self-contained, no shared references.
    resources:
    - name: products
      path: /products
      operations:
      - name: listproducts
        method: GET
        description: List credit products
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: array
          description: An array of statuses by which to filter credit products.
        - name: count
          in: query
          type: integer
          description: Number of credit product resources to retrieve.
        - name: start_index
          in: query
          type: integer
          description: Sort order index of the first resource in the returned array.
        - name: sort_by
          in: query
          type: string
          description: Field on which to sort.
      - name: createproduct
        method: POST
        description: Create credit product
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: products-token
      path: /products/{token}
      operations:
      - name: retrieveproduct
        method: GET
        description: Retrieve credit product
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Unique identifier of the credit product to retrieve.
          required: true
    - name: products-token-lineage
      path: /products/{token}/lineage
      operations:
      - name: lineageproducts
        method: GET
        description: Retrieve credit product lineage
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Unique identifier of the credit product whose lineage you want to retrieve.
          required: true
        - name: status
          in: query
          type: array
          description: An array of statuses by which to filter credit products.
        - name: count
          in: query
          type: integer
          description: Number of credit product resources to retrieve.
        - name: start_index
          in: query
          type: integer
          description: Sort order index of the first resource in the returned array.
        - name: sort_by
          in: query
          type: string
          description: Field on which to sort.
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: core-credit-products-rest
    port: 8080
    description: REST adapter for Core API — Credit Products. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/products
      name: products
      description: REST surface for products.
      operations:
      - method: GET
        name: listproducts
        description: List credit products
        call: core-credit-products.listproducts
        with:
          status: rest.status
          count: rest.count
          start_index: rest.start_index
          sort_by: rest.sort_by
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createproduct
        description: Create credit product
        call: core-credit-products.createproduct
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/products/{token}
      name: products-token
      description: REST surface for products-token.
      operations:
      - method: GET
        name: retrieveproduct
        description: Retrieve credit product
        call: core-credit-products.retrieveproduct
        with:
          token: rest.token
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/products/{token}/lineage
      name: products-token-lineage
      description: REST surface for products-token-lineage.
      operations:
      - method: GET
        name: lineageproducts
        description: Retrieve credit product lineage
        call: core-credit-products.lineageproducts
        with:
          token: rest.token
          status: rest.status
          count: rest.count
          start_index: rest.start_index
          sort_by: rest.sort_by
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-credit-products-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — Credit Products. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-credit-products
      description: List credit products
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-credit-products.listproducts
      with:
        status: tools.status
        count: tools.count
        start_index: tools.start_index
        sort_by: tools.sort_by
      outputParameters:
      - type: object
        mapping: $.
    - name: create-credit-product
      description: Create credit product
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-credit-products.createproduct
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-credit-product
      description: Retrieve credit product
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-credit-products.retrieveproduct
      with:
        token: tools.token
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-credit-product-lineage
      description: Retrieve credit product lineage
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-credit-products.lineageproducts
      with:
        token: tools.token
        status: tools.status
        count: tools.count
        start_index: tools.start_index
        sort_by: tools.sort_by
      outputParameters:
      - type: object
        mapping: $.
