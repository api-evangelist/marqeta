naftiko: 1.0.0-alpha2
info:
  label: Core API — fee refunds
  description: 'Core API — fee refunds. 1 operations. Lead operation: Creates a fee refund. Self-contained Naftiko capability
    covering one Marqeta business surface.'
  tags:
  - Marqeta
  - fee refunds
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-fee-refunds
    baseUri: ''
    description: Core API — fee refunds business capability. Self-contained, no shared references.
    resources:
    - name: feerefunds
      path: /feerefunds
      operations:
      - name: postfeerefunds
        method: POST
        description: Creates a fee refund
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: core-fee-refunds-rest
    port: 8080
    description: REST adapter for Core API — fee refunds. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/feerefunds
      name: feerefunds
      description: REST surface for feerefunds.
      operations:
      - method: POST
        name: postfeerefunds
        description: Creates a fee refund
        call: core-fee-refunds.postfeerefunds
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-fee-refunds-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — fee refunds. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: creates-fee-refund
      description: Creates a fee refund
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-fee-refunds.postfeerefunds
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
