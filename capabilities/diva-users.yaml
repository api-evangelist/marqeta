naftiko: 1.0.0-alpha2
info:
  label: Marqeta DiVA API — Users
  description: 'Marqeta DiVA API — Users. 2 operations. Lead operation: Retrieve detailed user information. Self-contained
    Naftiko capability covering one Marqeta business surface.'
  tags:
  - Marqeta
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: diva-users
    baseUri: https://diva-api.marqeta.com/data/v2
    description: Marqeta DiVA API — Users business capability. Self-contained, no shared references.
    resources:
    - name: views-users-detail
      path: /views/users/detail
      operations:
      - name: getusersdetail
        method: GET
        description: Retrieve detailed user information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: views-users-time_agg
      path: /views/users/{time_agg}
      operations:
      - name: getusers
        method: GET
        description: Retrieve user activity data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: diva-users-rest
    port: 8080
    description: REST adapter for Marqeta DiVA API — Users. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/views/users/detail
      name: views-users-detail
      description: REST surface for views-users-detail.
      operations:
      - method: GET
        name: getusersdetail
        description: Retrieve detailed user information
        call: diva-users.getusersdetail
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/views/users/{time-agg}
      name: views-users-time-agg
      description: REST surface for views-users-time_agg.
      operations:
      - method: GET
        name: getusers
        description: Retrieve user activity data
        call: diva-users.getusers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: diva-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Marqeta DiVA API — Users. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: retrieve-detailed-user-information
      description: Retrieve detailed user information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: diva-users.getusersdetail
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-user-activity-data
      description: Retrieve user activity data
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: diva-users.getusers
      outputParameters:
      - type: object
        mapping: $.
