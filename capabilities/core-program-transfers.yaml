naftiko: 1.0.0-alpha2
info:
  label: Core API — Program Transfers
  description: 'Core API — Program Transfers. 7 operations. Lead operation: List program transfers. Self-contained Naftiko
    capability covering one Marqeta business surface.'
  tags:
  - Marqeta
  - Program Transfers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-program-transfers
    baseUri: ''
    description: Core API — Program Transfers business capability. Self-contained, no shared references.
    resources:
    - name: programtransfers
      path: /programtransfers
      operations:
      - name: getprogramtransfers
        method: GET
        description: List program transfers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: count
          in: query
          type: integer
          description: Number of program transfers to retrieve.
        - name: start_index
          in: query
          type: integer
          description: Sort order index of the first resource in the returned array.
        - name: fields
          in: query
          type: string
          description: Comma-delimited list of fields to return (`field_1,field_2`, and so on).
        - name: sort_by
          in: query
          type: string
          description: Field on which to sort.
        - name: user_token
          in: query
          type: string
          description: Unique identifier of the user account holder whose program transfers you want to retrieve.
        - name: business_token
          in: query
          type: string
          description: Unique identifier of the business account holder whose program transfers you want to retrieve.
        - name: type_token
          in: query
          type: string
          description: Unique identifier of the program transfer type to retrieve.
      - name: postprogramtransfers
        method: POST
        description: Create program transfer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: programtransfers-types
      path: /programtransfers/types
      operations:
      - name: getprogramtransferstypes
        method: GET
        description: List program transfer types
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: count
          in: query
          type: integer
          description: Number of program transfer types to retrieve.
        - name: start_index
          in: query
          type: integer
          description: Sort order index of the first resource in the returned array.
        - name: fields
          in: query
          type: string
          description: Comma-delimited list of fields to return (`field_1,field_2`, and so on).
        - name: sort_by
          in: query
          type: string
          description: Field on which to sort.
      - name: postprogramtransferstypes
        method: POST
        description: Create program transfer type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: programtransfers-types-type_token
      path: /programtransfers/types/{type_token}
      operations:
      - name: getprogramtransferstypestypetoken
        method: GET
        description: Retrieve program transfer type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type_token
          in: path
          type: string
          description: Unique identifier of the program transfer type.
          required: true
      - name: putprogramtransferstypestypetoken
        method: PUT
        description: Update program transfer type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type_token
          in: path
          type: string
          description: Unique identifier of the program transfer type.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: programtransfers-token
      path: /programtransfers/{token}
      operations:
      - name: getprogramtransferstoken
        method: GET
        description: Retrieve program transfer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Unique identifier of the program transfer.
          required: true
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: core-program-transfers-rest
    port: 8080
    description: REST adapter for Core API — Program Transfers. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/programtransfers
      name: programtransfers
      description: REST surface for programtransfers.
      operations:
      - method: GET
        name: getprogramtransfers
        description: List program transfers
        call: core-program-transfers.getprogramtransfers
        with:
          count: rest.count
          start_index: rest.start_index
          fields: rest.fields
          sort_by: rest.sort_by
          user_token: rest.user_token
          business_token: rest.business_token
          type_token: rest.type_token
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postprogramtransfers
        description: Create program transfer
        call: core-program-transfers.postprogramtransfers
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/programtransfers/types
      name: programtransfers-types
      description: REST surface for programtransfers-types.
      operations:
      - method: GET
        name: getprogramtransferstypes
        description: List program transfer types
        call: core-program-transfers.getprogramtransferstypes
        with:
          count: rest.count
          start_index: rest.start_index
          fields: rest.fields
          sort_by: rest.sort_by
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postprogramtransferstypes
        description: Create program transfer type
        call: core-program-transfers.postprogramtransferstypes
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/programtransfers/types/{type-token}
      name: programtransfers-types-type-token
      description: REST surface for programtransfers-types-type_token.
      operations:
      - method: GET
        name: getprogramtransferstypestypetoken
        description: Retrieve program transfer type
        call: core-program-transfers.getprogramtransferstypestypetoken
        with:
          type_token: rest.type_token
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putprogramtransferstypestypetoken
        description: Update program transfer type
        call: core-program-transfers.putprogramtransferstypestypetoken
        with:
          type_token: rest.type_token
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/programtransfers/{token}
      name: programtransfers-token
      description: REST surface for programtransfers-token.
      operations:
      - method: GET
        name: getprogramtransferstoken
        description: Retrieve program transfer
        call: core-program-transfers.getprogramtransferstoken
        with:
          token: rest.token
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-program-transfers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — Program Transfers. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-program-transfers
      description: List program transfers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-program-transfers.getprogramtransfers
      with:
        count: tools.count
        start_index: tools.start_index
        fields: tools.fields
        sort_by: tools.sort_by
        user_token: tools.user_token
        business_token: tools.business_token
        type_token: tools.type_token
      outputParameters:
      - type: object
        mapping: $.
    - name: create-program-transfer
      description: Create program transfer
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-program-transfers.postprogramtransfers
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-program-transfer-types
      description: List program transfer types
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-program-transfers.getprogramtransferstypes
      with:
        count: tools.count
        start_index: tools.start_index
        fields: tools.fields
        sort_by: tools.sort_by
      outputParameters:
      - type: object
        mapping: $.
    - name: create-program-transfer-type
      description: Create program transfer type
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-program-transfers.postprogramtransferstypes
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-program-transfer-type
      description: Retrieve program transfer type
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-program-transfers.getprogramtransferstypestypetoken
      with:
        type_token: tools.type_token
      outputParameters:
      - type: object
        mapping: $.
    - name: update-program-transfer-type
      description: Update program transfer type
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: core-program-transfers.putprogramtransferstypestypetoken
      with:
        type_token: tools.type_token
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-program-transfer
      description: Retrieve program transfer
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-program-transfers.getprogramtransferstoken
      with:
        token: tools.token
      outputParameters:
      - type: object
        mapping: $.
