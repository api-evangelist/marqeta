    port: 9090
    transport: http
    description: MCP adapter for Core API — merchantgroups. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: lists-all-merchant-groups
      description: Lists all Merchant Groups
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-merchantgroups.getmerchantgroups
      with:
        mid: tools.mid
        count: tools.count
        start_index: tools.start_index
        sort_by: tools.sort_by
      outputParameters:
      - type: object
        mapping: $.
    - name: creates-merchant-group
      description: Creates a merchant group
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-merchantgroups.postmerchantgroup
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: returns-merchant-group
      description: Returns a Merchant Group
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-merchantgroups.getmerchantgroup
      with:
        token: tools.token
      outputParameters:
      - type: object
        mapping: $.
    - name: updates-merchant-group
      description: Updates an Merchant Group
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: core-merchantgroups.putmerchantgroupstoken
      with:
        token: tools.token
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
