naftiko: 1.0.0-alpha2
info:
  label: Core API — merchantgroups
  description: 'Core API — merchantgroups. 4 operations. Lead operation: Lists all Merchant Groups. Self-contained Naftiko
    capability covering one Marqeta business surface.'
  tags:
  - Marqeta
  - merchantgroups
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-merchantgroups
    baseUri: ''
    description: Core API — merchantgroups business capability. Self-contained, no shared references.
    resources:
    - name: merchantgroups
      path: /merchantgroups
      operations:
      - name: getmerchantgroups
        method: GET
        description: Lists all Merchant Groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: mid
          in: query
          type: string
          description: mid
        - name: count
          in: query
          type: integer
          description: Number of items to retrieve. Count can be between 1 - 10 items.
        - name: start_index
          in: query
          type: integer
          description: Indicates from what row to start returning data.
        - name: sort_by
          in: query
          type: string
          description: Field by which to sort the returned items. Use any field in the model, or system fields lastModifiedTime
            or createdTime.
      - name: postmerchantgroup
        method: POST
        description: Creates a merchant group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: merchantgroups-token
      path: /merchantgroups/{token}
      operations:
      - name: getmerchantgroup
        method: GET
        description: Returns a Merchant Group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Merchant Group token
          required: true
      - name: putmerchantgroupstoken
        method: PUT
        description: Updates an Merchant Group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: core-merchantgroups-rest
    port: 8080
    description: REST adapter for Core API — merchantgroups. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/merchantgroups
      name: merchantgroups
      description: REST surface for merchantgroups.
      operations:
      - method: GET
        name: getmerchantgroups
        description: Lists all Merchant Groups
        call: core-merchantgroups.getmerchantgroups
        with:
          mid: rest.mid
          count: rest.count
          start_index: rest.start_index
          sort_by: rest.sort_by
        outputParameters:
        - type: object
          mapping: $.
