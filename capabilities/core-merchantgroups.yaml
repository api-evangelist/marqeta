        description: Creates a merchant group
        call: core-merchantgroups.postmerchantgroup
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/merchantgroups/{token}
      name: merchantgroups-token
      description: REST surface for merchantgroups-token.
      operations:
      - method: GET
        name: getmerchantgroup
        description: Returns a Merchant Group
        call: core-merchantgroups.getmerchantgroup
        with:
          token: rest.token
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putmerchantgroupstoken
        description: Updates an Merchant Group
        call: core-merchantgroups.putmerchantgroupstoken
        with:
          token: rest.token
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
