naftiko: 1.0.0-alpha2
info:
  label: Core API — card transitions
  description: 'Core API — card transitions. 3 operations. Lead operation: Creates a card transition object. Self-contained
    Naftiko capability covering one Marqeta business surface.'
  tags:
  - Marqeta
  - card transitions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MARQETA_API_KEY: MARQETA_API_KEY
capability:
  consumes:
  - type: http
    namespace: core-card-transitions
    baseUri: ''
    description: Core API — card transitions business capability. Self-contained, no shared references.
    resources:
    - name: cardtransitions
      path: /cardtransitions
      operations:
      - name: postcardtransitions
        method: POST
        description: Creates a card transition object
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: cardtransitions-card-token
      path: /cardtransitions/card/{token}
      operations:
      - name: getcardtransitionscardtoken
        method: GET
        description: Lists all card transitions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Card token
          required: true
        - name: count
          in: query
          type: integer
          description: Number of card transitions to retrieve
        - name: start_index
          in: query
          type: integer
          description: Start index
        - name: fields
          in: query
          type: string
          description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
        - name: sort_by
          in: query
          type: string
          description: Sort order
    - name: cardtransitions-token
      path: /cardtransitions/{token}
      operations:
      - name: getcardtransitionstoken
        method: GET
        description: Returns a card transition object
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: token
          in: path
          type: string
          description: Card transition token
          required: true
        - name: fields
          in: query
          type: string
          description: Comma-delimited list of fields to return (e.g. field_1,field_2,..). Leave blank to return all fields.
    authentication:
      type: basic
      username: '{{env.MARQETA_USER}}'
      password: '{{env.MARQETA_PASS}}'
  exposes:
  - type: rest
    namespace: core-card-transitions-rest
    port: 8080
    description: REST adapter for Core API — card transitions. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/cardtransitions
      name: cardtransitions
      description: REST surface for cardtransitions.
      operations:
      - method: POST
        name: postcardtransitions
        description: Creates a card transition object
        call: core-card-transitions.postcardtransitions
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cardtransitions/card/{token}
      name: cardtransitions-card-token
      description: REST surface for cardtransitions-card-token.
      operations:
      - method: GET
        name: getcardtransitionscardtoken
        description: Lists all card transitions
        call: core-card-transitions.getcardtransitionscardtoken
        with:
          token: rest.token
          count: rest.count
          start_index: rest.start_index
          fields: rest.fields
          sort_by: rest.sort_by
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cardtransitions/{token}
      name: cardtransitions-token
      description: REST surface for cardtransitions-token.
      operations:
      - method: GET
        name: getcardtransitionstoken
        description: Returns a card transition object
        call: core-card-transitions.getcardtransitionstoken
        with:
          token: rest.token
          fields: rest.fields
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: core-card-transitions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Core API — card transitions. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: creates-card-transition-object
      description: Creates a card transition object
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: core-card-transitions.postcardtransitions
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: lists-all-card-transitions
      description: Lists all card transitions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-card-transitions.getcardtransitionscardtoken
      with:
        token: tools.token
        count: tools.count
        start_index: tools.start_index
        fields: tools.fields
        sort_by: tools.sort_by
      outputParameters:
      - type: object
        mapping: $.
    - name: returns-card-transition-object
      description: Returns a card transition object
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: core-card-transitions.getcardtransitionstoken
      with:
        token: tools.token
        fields: tools.fields
      outputParameters:
      - type: object
        mapping: $.
